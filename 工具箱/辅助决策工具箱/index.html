<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辅助决策工具箱 · 四合一组合向导 — 基于《对赌（实践版）》</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f4;
    --surface: #ffffff;
    --border: #e6e3dd;
    --text: #1a1a1a;
    --text-secondary: #55534f;
    --text-muted: #999590;
    --accent: #1a56db;
    --accent-soft: #eaf0fd;
    --success: #1a7f3f;
    --success-soft: #e9f5ec;
    --warning: #b85415;
    --warning-soft: #fdf1e7;
    --danger: #c02a2a;
    --radius: 8px;
    --radius-sm: 5px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  .container { max-width: none; margin: 0 auto; padding: 24px 32px 80px; }
  .narrow { max-width: 1080px; margin-left: auto; margin-right: auto; }

  .hero, .report-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 30px 32px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .hero .kicker { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 8px; }
  .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 14px; }
  .hero p { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
  .report-list h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  /* 首页默认流程示意卡 */
  .flow-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .flow-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
               background: #fcfbfa; border-top: 3px solid var(--accent); }
  .flow-card h4 { font-size: 13px; margin-bottom: 4px; }
  .flow-card .fc-src { font-size: 11px; color: var(--accent); margin-bottom: 4px; }
  .flow-card .fc-desc { font-size: 12px; color: var(--text-secondary); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; transition: background 0.12s;
  }
  .btn:hover { background: #1646b0; }
  .btn.secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn.secondary:hover { background: #f0efec; }
  .btn.danger-ghost { background: transparent; color: var(--danger); border: 1px solid transparent; font-weight: 500; padding: 6px 12px; }
  .btn.danger-ghost:hover { background: #fbeaea; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .report-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 padding: 12px 0; border-bottom: 1px solid var(--border); }
  .report-item:last-child { border-bottom: none; }
  .report-item .ri-main { flex: 1; cursor: pointer; min-width: 0; }
  .report-item .ri-title { font-size: 14px; font-weight: 600; }
  .report-item .ri-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ri-tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; color: #fff; }
  .empty-hint { font-size: 13px; color: var(--text-muted); }

  /* 两层步骤条：上层模块阶段条，下层当前模块内步骤胶囊 */
  .phase-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .phase-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12.5px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .phase-chip .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .phase-chip.active { font-weight: 700; color: var(--text); }
  .phase-chip.done { color: var(--text-secondary); }

  .stepper { display: flex; align-items: center; gap: 4px; margin-bottom: 22px; flex-wrap: wrap; }
  .step-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .step-chip .num { width: 17px; height: 17px; border-radius: 50%; background: #eceae6;
                    display: inline-flex; align-items: center; justify-content: center;
                    font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
  .step-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .step-chip.active .num { background: var(--accent); color: #fff; }
  .step-chip.done { color: var(--success); }
  .step-chip.done .num { background: var(--success); color: #fff; }
  .step-sep { color: #d4d1cb; font-size: 11px; }

  .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: var(--shadow); overflow: hidden; }
  .step-head { padding: 24px 32px 18px; border-bottom: 1px solid var(--border); }
  .step-head .tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent);
                    background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .step-head h2 { font-size: 20px; font-weight: 700; }
  .step-body { padding: 24px 32px 32px; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .review-col { display: flex; flex-direction: column; gap: 16px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 box-shadow: var(--shadow); overflow: hidden; }
  .review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 padding: 12px 18px; border-bottom: 1px solid var(--border); background: #faf9f7; }
  .review-head h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
  .btn-edit { border: 1px solid var(--border); background: #fff; color: var(--accent); font-size: 12px;
              font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .btn-edit:hover { border-color: var(--accent); }
  .btn-edit.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rv-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rv-nav h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-arrow { border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-size: 14px; line-height: 1; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .rv-arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .rv-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
  .review-body { padding: 16px 18px 20px; font-size: 13.5px; }
  /* 右侧辅助信息框：斜角页签（回顾过往步骤 / 判断基准），活动页签与下方卡片连成一体 */
  /* 编辑已保存报告时的提示条 */
  .edit-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
              background: var(--accent-soft); border: 1px solid #c9d8f8; color: var(--accent);
              border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12.5px; margin-bottom: 12px; }
  .aux-tabs { display: flex; align-items: flex-end; gap: 3px; padding-left: 12px; margin-bottom: -1px; position: relative; z-index: 1; }
  .aux-tab { transform: skewX(-14deg); border: 1px solid var(--border); border-bottom: none; background: #f2f0ec;
             color: var(--text-muted); font-family: inherit; font-size: 12.5px; font-weight: 600;
             padding: 6px 15px; border-radius: 7px 7px 0 0; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .aux-tab > span { display: inline-block; transform: skewX(14deg); }
  .aux-tab:hover { color: var(--accent); }
  .aux-tab.on { background: var(--surface); color: var(--accent); }
  /* 第二行（工具切换）更小一档，配色由各工具的主题色内联给出；上面还有一行时不与卡片相连 */
  .aux-tab.sub { font-size: 11.5px; padding: 4px 12px; }
  .aux-tab.sub.on { font-weight: 700; }
  .review-body .field { margin-bottom: 16px; }
  .review-body textarea { min-height: 54px; font-size: 13px; }
  .locked { opacity: 0.82; }
  .locked input, .locked textarea { background: #faf9f7; border-color: transparent; color: var(--text-secondary);
                                    box-shadow: none !important; }
  .locked .yn-btn, .locked .as-btn, .locked .radio-option, .locked .list-add, .locked .row-remove,
  .locked .score-btn, .locked .chip, .locked .sq-check, .locked .mp-card { pointer-events: none; }

  .field { margin-bottom: 26px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; display: block; }
  .field-label .opt-name { color: var(--accent); }
  .field-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .meta-note { background: #faf9f7; border: 1px dashed var(--border); border-radius: var(--radius-sm);
               padding: 8px 12px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }
  input[type="text"], textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
  textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

  /* s0 起始步：模块勾选卡 */
  .mp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mp-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px;
             background: #fff; cursor: pointer; transition: all 0.12s; }
  .mp-card:hover { border-color: var(--accent); }
  .mp-card.on { border-color: var(--accent); background: var(--accent-soft); }
  .mp-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .mp-check { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 6px; background: #fff;
              color: transparent; font-size: 13px; line-height: 1; flex-shrink: 0;
              display: inline-flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .mp-card.on .mp-check { border-color: var(--accent); background: var(--accent); color: #fff; }
  .mp-name { font-size: 14.5px; font-weight: 700; flex: 1; }
  .mp-ord { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
            font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mp-src { font-size: 11.5px; color: var(--accent); margin-bottom: 4px; }
  .mp-desc { font-size: 12.5px; color: var(--text-secondary); }
  .mp-card.mp-default { border-style: solid; background: #fbfcff; }
  .mp-card.mp-default.on { border-style: solid; }
  /* s0 两个互斥选择区：选中一边另一边整体变灰（仍可点击切换） */
  .mp-zone { transition: opacity 0.15s; }
  .mp-zone.dimmed { opacity: 0.42; }
  .mp-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--text-muted); font-size: 12.5px; }
  .mp-divider::before, .mp-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .mp-rec { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 8px; }

  /* s0 已选模块词条列表：⠿ 手柄 + 序号 + 模块名，HTML5 拖拽排序 */
  .sel-list { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .sel-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sel-row:last-child { border-bottom: none; }
  .sel-row.dragging { opacity: 0.4; }
  .sel-row.drag-over { border-top: 2px solid var(--accent); }
  .sel-drag { cursor: grab; color: var(--text-muted); font-size: 14px; user-select: none; flex-shrink: 0; padding: 0 2px; }
  .sel-drag:hover { color: var(--accent); }
  .sel-drag:active { cursor: grabbing; }
  .sel-drag.off { cursor: default; opacity: 0.4; }
  .sel-ord { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
             font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sel-name { font-weight: 600; }

  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-group.inline { flex-direction: row; }
  .radio-group.inline .radio-option { flex: 1; }
  .radio-option {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
    transition: all 0.12s; font-size: 13.5px;
  }
  .radio-option:hover { border-color: var(--accent); }
  .radio-option.checked { border-color: var(--accent); background: var(--accent-soft); }
  .radio-option input { margin-top: 3px; accent-color: var(--accent); }
  .radio-option .opt-desc { color: var(--text-muted); font-size: 12px; display: block; }

  .score-row { display: flex; gap: 8px; align-items: center; }
  .score-btn {
    width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text-secondary);
    transition: all 0.12s;
  }
  .score-btn:hover { border-color: var(--accent); }
  .score-btn.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .score-endlabel { font-size: 11.5px; color: var(--text-muted); width: 74px; line-height: 1.4; }
  .score-endlabel.right { text-align: right; color: var(--accent); }

  .list-rows { display: flex; flex-direction: column; gap: 10px; }
  .list-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fcfbfa;
              display: flex; gap: 10px; align-items: flex-start; }
  .list-row .idx { font-size: 12px; color: var(--text-muted); font-weight: 700; padding-top: 9px; flex-shrink: 0; }
  .list-row textarea { flex: 1; resize: none; overflow: hidden; min-height: 40px; padding: 7px 10px; font-size: 13.5px; }
  .row-cmp { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
  .row-cmp .chip { padding: 4px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px;
                   cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .row-cmp .chip:hover { border-color: var(--accent); }
  .row-cmp .chip.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-remove { flex-shrink: 0; border: none; background: transparent; color: var(--text-muted);
                cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; line-height: 1; }
  .row-remove:hover { color: var(--danger); background: #fbeaea; }
  .list-add { border: 1px dashed var(--border); background: transparent; color: var(--accent);
              padding: 9px; width: 100%; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; margin-top: 10px; }
  .list-add:hover { border-color: var(--accent); background: var(--accent-soft); }
  .list-empty-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

  .as-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .as-item { font-size: 13.5px; margin-bottom: 8px; }
  .as-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .as-btn { padding: 4px 16px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 999px;
            cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .as-btn:hover { border-color: var(--accent); }
  .as-btn.picked-1 { background: var(--accent); border-color: var(--accent); color: #fff; }
  .as-btn.picked-2 { background: #7a86a8; border-color: #7a86a8; color: #fff; }
  .as-btn.picked-3 { background: #eceae6; border-color: #d4d1cb; color: var(--text-secondary); }

  /* ---------- decision-pacing 特有：唯一选择测验 ---------- */
  .cl-list { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .cl-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .cl-row:last-child { border-bottom: none; }
  .cl-item { flex: 1; min-width: 0; font-size: 13.5px; }
  .sq-check { width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 6px; background: #fff;
              color: transparent; font-size: 15px; line-height: 1; cursor: pointer; flex-shrink: 0;
              display: inline-flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .sq-check:hover:not(:disabled) { border-color: var(--success); }
  .radio-option .sq-check { margin-top: 1px; font-size: 14px; }
  .sq-check.checked { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .locked .sq-check { pointer-events: none; }

  /* ---------- six-step 特有：决策树 / 页签 / 组内比较 / 半栏 ---------- */
  .dt-branches { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; min-width: 0; }
  .dt-branch-head { font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; }
  .dt-branch { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .dt-branch:last-of-type { margin-bottom: 4px; }
  .dt-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; padding-top: 4px; }
  .dt-branch-body { flex: 1; min-width: 0; }
  .dt-branch-body textarea { width: 100%; border: none; border-bottom: 1px dashed var(--border); border-radius: 0; background: transparent; font-size: 13px; padding: 4px 2px; resize: none; overflow: hidden; min-height: 0; }
  .dt-branch-body textarea:focus { outline: none; border-bottom-color: var(--accent); box-shadow: none; }
  .dt-sorthint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .dt-drag { cursor: grab; color: var(--text-muted); font-size: 14px; padding: 3px 2px 0; user-select: none; flex-shrink: 0; }
  .dt-drag:hover { color: var(--accent); }
  .dt-drag:active { cursor: grabbing; }
  .dt-branch.dragging { opacity: 0.4; }
  .dt-branch.drag-over { border-top: 2px solid var(--accent); padding-top: 4px; }
  .locked .dt-branch { cursor: default; }

  .half-row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
  .half-row .field.half { flex: 1; min-width: 0; margin-bottom: 0; }

  .otabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .otab { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all 0.12s; }
  .otab:hover { border-color: var(--accent); color: var(--accent); }
  .otab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .sum-list { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; overflow: hidden; }
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .sum-row:last-child { border-bottom: none; }
  .sum-rank { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
              font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sum-text { flex: 1; min-width: 0; font-size: 13.5px; }
  .sum-prob { font-size: 12px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .sum-prob.none { color: var(--text-muted); font-weight: 400; }

  /* ---------- perspective 特有：基准条 / 基准数三联行 / 内外视角双栏 ---------- */
  .tri-sub { display: flex; gap: 8px; }
  .tri-sub input { flex: 1; min-width: 0; }
  .vt-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .vt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }

<div class="container" id="app"></div>

<script>
"use strict";

/* =====================================================================
 * 模块配置（四个源工具的 TOOL 配置近乎原样移植，仅读写落点改为模块作用域）
 * ===================================================================== */

/* ---------- 模块一：决策速度（移植自 decision-pacing，第七章，原 ls 前缀 dp2） ---------- */
const MOD_DP = {
  id: "dp",
  name: "决策速度",
  chapter: "第七章",
  src: "《对赌（实践版）》第七章 · 时间与准确性的权衡",
  desc: "沿“快速决策指南”分支树逐题判断：这个决策该快还是该慢。",
  color: "#1a56db",
  reportName: "快速决策指南报告",
  titleKey: "title",
  titleStep: "s1",
  titleNote: "请先陈述这个决策",
  conclusionKey: "conclusion",
  conclusionLabel: "一句话结论",
  skipEmptySection: true,
  steps: [
    { id: "s1", title: "锚定决策", tag: "明确对象", need: "title", needHint: "请先陈述这个决策", desc: "陈述要判断节奏的决策，并描述当前处境。" },
    { id: "q1", title: "这个决策是否通过了幸福感测验？", tag: "图1 · 低影响力", need: "hap_pass", needHint: "请先回答：是否通过了幸福感测验", desc: "" },
    { id: "q2", title: "它属于重复性决策吗？", tag: "图1 · 重复性选择", need: "repeat", needHint: "请先回答这个问题", desc: "" },
    { id: "q3", title: "它属于“但试无妨”的情况吗？", tag: "图1 · 下行风险", need: "freeway", needHint: "请先回答这个问题", desc: "" },
    { id: "q4", title: "这个决策是“披着狼皮的羊”吗？", tag: "图1 · 相近选项", need: "sheep", needHint: "请先回答这个问题", desc: "" },
    { id: "q6", title: "你能以合理的代价放弃这个决策吗？", tag: "图1 · 主动放弃", need: "exit", needHint: "请先回答这个问题", desc: "" },
    { id: "q5", title: "你可以同时做出多个选择吗？", tag: "图1 · 同时多选", need: "parallel", needHint: "请先回答这个问题", desc: "" },
    { id: "q7", title: "你可以进行渐进式决策吗？", tag: "图1 · 渐进式", need: "gradual", needHint: "请先回答这个问题", desc: "" },
    { id: "t_fast", title: "终点：快速决策", tag: "图1 · 结论", desc: "" },
    { id: "t_soon", title: "终点：尽快作出决定", tag: "图1 · 结论", desc: "" },
    { id: "t_gradual", title: "终点：先做一些影响小的决策", tag: "图1 · 结论", desc: "" },
    { id: "t_slow", title: "终点：放慢速度！", tag: "图1 · 结论", desc: "" },
    { id: "q8", title: "有没有什么信息能让你改变决定？", tag: "图2 · 决策最后一步", need: "info", needHint: "请先回答这个问题", desc: "" },
    { id: "q9", title: "我负担得起吗？", tag: "图2 · 信息的代价", need: "afford", needHint: "请先回答这个问题", desc: "" },
    { id: "s_end", title: "一句话结论", tag: "收尾", desc: "" }
  ],
  // 快速决策指南（图1）分支树 + 决策最后一步（图2）。
  // 路径只延伸到第一个未回答的分支问题为止；不在路径上的答案保留在 values 中。
  pathIds: function (v) {
    const answered = k => v[k] === "yes" || v[k] === "no";
    const p = ["s1"];
    if (!String(v.title || "").trim()) return p;
    p.push("q1");
    if (!answered("hap_pass")) return p;
    if (v.hap_pass === "yes") {
      p.push("q2");
      if (!answered("repeat")) return p;
      // 通过幸福感测验：重复性选择 → 快速决策；非重复性 → 直接闭环，尽快作出决定
      p.push(v.repeat === "yes" ? "t_fast" : "t_soon");
    } else {
      p.push("q3");
      if (!answered("freeway")) return p;
      if (v.freeway === "yes") {
        p.push("t_fast");
      } else {
        p.push("q4");
        if (!answered("sheep")) return p;
        if (v.sheep === "yes") {
          p.push("q5");
          if (!answered("parallel")) return p;
          p.push(v.parallel === "yes" ? "t_fast" : "t_soon");
        } else {
          p.push("q6");
          if (!answered("exit")) return p;
          if (v.exit === "yes") {
            p.push("q5");
            if (!answered("parallel")) return p;
            p.push(v.parallel === "yes" ? "t_fast" : "t_soon");
          } else {
            p.push("q7");
            if (!answered("gradual")) return p;
            p.push(v.gradual === "yes" ? "t_gradual" : "t_slow");
          }
        }
      }
    }
    // 决策最后一步（图2）：对接所有快速/尽快决策的终点，完成后才进入一句话总结；放慢类终点（渐进式/放慢速度）直接收尾
    const term = p[p.length - 1];
    if (term === "t_fast" || term === "t_soon") {
      p.push("q8");
      if (!answered("info")) return p;
      if (v.info === "yes") {
        p.push("q9");
        if (!answered("afford")) return p;
      }
    }
    p.push("s_end");
    return p;
  },
  stepMeta: {
    s1: "先锚定决策本身——后面的检验都围绕它展开。处境描述（背景、约束、时间点）会在你做判断时提供参照。候选选项不在这里填写：走到“披着狼皮的羊”环节时再列出并逐条测验。",
    q1: "幸福感测验：问问自己的决策结果（无论好坏）是否有可能在一年内显著影响到你的幸福感。一个月呢？一周呢？你回答“不，对我的幸福感没有太大影响”的时间段越短，就越可以为了节省时间而牺牲准确性。",
    q2: "重复性选择是指相同类型的决策反复出现，你会得到重复选择的机会，还可以尝试过去放弃的选择。重复做决定能淡化后悔情绪——再做一次决定，能够减少低影响力决策不良结果的微小代价。",
    q3: "“但试无妨”的关键特征是下行风险有限：上行潜力和下行风险存在不对称性，潜在损失可以忽略不计。问自己两个问题：①最糟的结果是什么？②假如结果不尽如人意，我会面临比决策前更差的情况吗？提醒：免费甜甜圈不属于“但试无妨”——要考虑多次做出相同决策的累积影响，而不是只关注一次性的潜在危害。",
    q4: "难以决策＝很容易选择：拖慢决策的东西，即质量非常接近的多个选项，实际上是可以加快速度的信号——既然选项的上行潜力和下行风险相似，无论怎么选都不可能出错。用“唯一选择测验”打破僵局：对每个选项问自己“如果这是唯一的选择，我会感觉满意吗？”假如有多个选项的答案是肯定的，你就可以随机选择。",
    q6: "任何选择都有机会成本。问问自己：“现在做出的这个选择，将来若想放弃需要付出何种代价？”将来改弦更张的成本越低，就越可以加快决策速度——退出成本低的决策就是“双向门”决策。别凭直觉认为决策不可更改：美国37%的大学生会转学。多数时候，放弃造成的损失比你想象的少。",
    q5: "同时做出多个选择能降低机会成本（同时获得这些选择的潜在收益），也能降低潜在风险——每件事各有10%的失败概率时，总体失败的概率几乎为零。但“可以”并不等于“应该”：多选要消耗更多资源，也会影响完成效果。",
    q7: "渐进式决策：在做出影响大、难以放弃的“单向门”决策之前，先设法做出一些影响小、易于放弃的决定来收集信息。想在一个社区买房，就先在那里租房体验一下；确立稳定关系之前，先多约会几次。",
    q8: "好的决策过程离不开最后一个问题：“有没有什么信息能让我改变主意？”我们的决定几乎都是在不完全信息的基础上做出的。如果答案是“没有”，那就赶紧做决定——你已经大功告成；如果有，再问自己能否以负担得起的代价获得这些信息。",
    q9: "信息即便可以获得，也可能因为时间、金钱、社会资本等原因太过昂贵——等你在波士顿住完一整个冬天弄清自己能否适应，那份工作早就没了。若信息能获得且代价负担得起，那就去找；否则，趁早做决定。",
    s_end: "摆脱“分析瘫痪”对照单：通过幸福感测验→尽快作出决定，若还属于重复性选择→快速决策、更快；但试无妨→迅速抓住机会、在执行上多花时间；多个选项通过唯一选择测验→快速决策甚至随机选择；能以合理代价放弃→快速决策，不能则渐进式决策；能同时多选→快速决策，不能也尽快定；没有能改变主意的信息→趁早做决定。"
  },
  verdict: function (v) {
    const p = MOD_DP.pathIds(v);
    let main = "", cls = "vb-neutral";
    if (p.indexOf("t_fast") >= 0) {
      let why = "";
      if (p.indexOf("q2") >= 0 && v.repeat === "yes") why = "低影响力＋重复性选择，可以加快速度";
      else if (p.indexOf("q3") >= 0 && v.freeway === "yes") why = "但试无妨：下行风险有限";
      else if (p.indexOf("q5") >= 0) {
        why = v.sheep === "yes" ? "披着狼皮的羊：选项相近，怎么选都不会出错" : "退出成本低的“双向门”决策";
        if (v.parallel === "yes") why += "，且可同时多选，可以加快速度";
      }
      main = "快速决策" + (why ? "（" + why + "）" : "");
      cls = "vb-success";
    } else if (p.indexOf("t_soon") >= 0) {
      let why = "";
      if (v.hap_pass === "yes") why = "通过了幸福感测验的低影响力决策，纵然不常重复";
      else if (v.sheep === "yes") why = "选项相近，怎么选都不会出错，但无法同时多选";
      else why = "退出成本低的“双向门”决策，但无法同时多选";
      main = "尽快作出决定（" + why + "）";
      cls = "vb-success";
    } else if (p.indexOf("t_gradual") >= 0) {
      main = "先做一些影响小的决策（渐进式收集信息）"; cls = "vb-accent";
    } else if (p.indexOf("t_slow") >= 0) {
      main = "放慢速度！这个决策值得动用完整的决策过程"; cls = "vb-warning";
    } else {
      return { t: "未完成评估", cls: "vb-neutral" };
    }
    let tail = "";
    if (p.indexOf("q8") >= 0) {

/* ---------- 模块二：六步决策（移植自 six-step，第四章，原 ls 前缀 ss2） ---------- */
/* 决策清单 = 第 1 个“本次决策” + 其余候选：
   第 1 个决策由决策速度第 1 步的决策陈述同步而来（存在 title，见 syncDecisionText），不进候选数组；
   decisions 只放用户在本步追加、或从决策速度“披着狼皮的羊”环节带入的候选决策。 */
function decisionsOf(vals) {
  const head = String(vals.title || "").trim();
  const rest = (Array.isArray(vals.decisions) ? vals.decisions : [])
    .filter(d => (d && (d.t || "").trim()) && String(d.t).trim() !== head);
  return head ? [{ t: head }].concat(rest) : rest;
}
/* 最终选择支持多选：值存成 { d0: "yes", d2: "yes" }；旧的单选值（"d1"）照旧能读 */
function finalPicks(v) {
  const raw = v ? v.final_pick : null;
  const keys = (raw && typeof raw === "object")
    ? Object.keys(raw).filter(k => raw[k] === "yes")
    : (typeof raw === "string" && raw ? [raw] : []);
  return keys.map(k => Number((/^d(\d+)$/.exec(k) || [])[1])).filter(i => i >= 0).sort((a, b) => a - b);
}
/* 多选字段里已勾选的选项文字（兼容旧的单选字符串值） */
function pickedOptionTexts(f, val) {
  const on = (val && typeof val === "object") ? val : (typeof val === "string" && val ? { [val]: "yes" } : {});
  return (f.options || []).filter(o => on[o[0]] === "yes").map(o => o[1]);
}
function optListD(vals, di) { return (Array.isArray(vals["options_d" + di]) ? vals["options_d" + di] : []).filter(o => (o && (o.t || "").trim())); }
function trunc(s, n) {
  s = String(s || "").replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n) + "…" : s;
}
/* 决策分析页（一个决策一页）内的三个环节：页签切换，上一步/下一步先在环节间走 */
const SS_PHASES = ["可能结果", "评估概率", "组内比较"];

const MOD_SS = {
  id: "ss",

  chapter: "第四章",
  src: "《对赌（实践版）》第四章 · 六步决策法",

  conclusionKey: "conclusion",
  conclusionLabel: "最终决定与结论",

  // s1 →（对每个决策 i，各一页）sd_d{i} → s5
  steps: [
    { id: "s1", title: "背景与候选决策", tag: "锚定背景", need: function (v) { return decisionsOf(v).length > 0; }, needHint: "请先填写本次决策，或添加一个候选决策", desc: "写下背景，并列出多个候选决策。" },
    { id: "sd", title: "决策分析", tag: "结果 · 概率 · 比较", desc: "对每个决策分别进行：同一页内切换“可能结果 / 评估概率 / 组内比较”三个环节。" },
    { id: "s5", title: "最终选择", tag: "跨决策比较", desc: "综合比较所有候选决策，做出最终选择并写下结论。" }
  ],
  // 动态路径：背景非空且至少有一个决策时，路径才延伸到 s5 之前
  path: function (v) {
    v = v || {};
    const reg = {};
    MOD_SS.steps.forEach(s => { reg[s.id] = s; });
    const p = [reg.s1];
    const ds = decisionsOf(v);
    if (!String(v.bg || "").trim() || !ds.length) return p;
    /* 一个决策一页：结果、概率、比较三个环节合并到同一步，页签切换 */
    ds.forEach((d, i) => {
      p.push({ id: "sd_d" + i, base: "sd", di: i, title: "决策 " + (i + 1), tag: reg.sd.tag, desc: reg.sd.desc });
    });
    p.push(reg.s5);
    return p;
  },
  stepMeta: {
    s1: "先把这一系列决策的背景交代清楚，再列出候选决策：第 1 个决策是上面的“本次决策”（与决策速度同步），其余候选追加在下面——候选列得越全，后面的比较越可靠。接下来每一步对应一个决策。",
    sd: "同一个决策的三个环节合在这一页，用上方页签切换。① 可能结果：把它可能导向的结果全部摆上树，先穷尽、再排序——顺序就是你的偏好；② 评估概率：所有结果列在一张表里，直接在结果后面填你估计的概率，下面三问（你知道的 / 你不知道的 / 为什么这样估）统一解释这些估计——信息缺口越大，估计越该保守；③ 组内比较：综合“可能结果 × 可能性”，选出这个决策下的第一选择。",
    s5: "回头看每个决策在“组内比较”环节选出的结果，跨决策综合比较，做出最终选择。决定几乎都是在不完全信息下做出的——比较完就趁早定下来。"
  },
  verdict: function (v) {
    const ds = decisionsOf(v);

  },

      const ro = dpBefore("ss");
      return [

    if (di == null) return [];
    if (base === "sd") {
      /* 一个决策一页：三个环节用页签切换（pg = 环节序号） */
      const sfx = "_d" + di;
      const opts = optListD(v, di);
      const fs = [{ type: "ptabs", labels: SS_PHASES }];
      /* ① 可能结果 */
      fs.push({ key: "options" + sfx, type: "otree", pg: 0 });

      /* 勾选“有”后：先从这条决策已列出的潜在结果里挑一个，挑完再说明理由 */
      const optChoices = opts.map((o, j) => ["opt" + j, "结果 " + (j + 1) + "：" + o.t]);
      const bestOn = function (vv) { return vv["best_yes" + sfx] === "yes"; };
      const worstOn = function (vv) { return vv["worst_yes" + sfx] === "yes"; };
      /* 理由：挑完之后才出现；旧数据把“是哪一个”和理由写在同一格，填过就继续显示，免得旧报告丢答案 */
      const reasonOn = function (yesOn, pickKey, noteKey) {
        return function (vv) {
          if (!yesOn(vv)) return false;
          return (vv[pickKey] != null && vv[pickKey] !== "") || String(vv[noteKey] || "").trim() !== "";
        };
      };
      const noOptNote = function (which) {
        return { type: "note", pg: 0, label: "还没有潜在结果", text: "请先在上方“潜在结果”里列出结果，再回来勾选" + which + "。" };
      };
      fs.push({ key: "best_yes" + sfx, pg: 0, label: "是否有哪个结果明显好于其他结果？", type: "radio", inline: true, options: [["yes", "有", "存在一个明显最优的结果"], ["no", "没有", "最好的几个结果难分高下"]] });
      if (optChoices.length) {
        fs.push({ key: "best_pick" + sfx, pg: 0, label: "是哪一个？（从这条决策已列出的潜在结果中选择）", type: "radio", options: optChoices, showIf: bestOn });
        fs.push({ key: "best_note" + sfx, pg: 0, label: "为什么明显更好？", type: "textarea", placeholder: "例：它在收入和发展上都占优，且失败也能退回原状……", showIf: reasonOn(bestOn, "best_pick" + sfx, "best_note" + sfx) });
      } else {
        fs.push(Object.assign(noOptNote("明显更好的那一个"), { showIf: bestOn }));
      }
      fs.push({ key: "worst_yes" + sfx, pg: 0, label: "是否有哪个结果明显比其他结果差？", type: "radio", inline: true, options: [["yes", "有", "存在一个明显最糟的结果"], ["no", "没有", "最差的情况也都还能接受"]] });
      if (optChoices.length) {
        fs.push({ key: "worst_pick" + sfx, pg: 0, label: "是哪一个？（从这条决策已列出的潜在结果中选择）", type: "radio", options: optChoices, showIf: worstOn });
        fs.push({ key: "worst_note" + sfx, pg: 0, label: "为什么明显更差？", type: "textarea", placeholder: "例：它会直接影响健康，且不可逆……", showIf: reasonOn(worstOn, "worst_pick" + sfx, "worst_note" + sfx) });
      } else {
        fs.push(Object.assign(noOptNote("明显更差的那一个"), { showIf: worstOn }));
      }
      /* ② 评估概率：结果全部列在一张表里，直接在结果后面填概率；
         下面三问是对本页所有概率估计的统一解释，不按结果拆分 */
      if (!opts.length) {
        fs.push({ type: "note", pg: 1, label: "还没有潜在结果", text: "请先在本页的“可能结果”环节添加潜在结果，这里会为每个结果生成概率评估。" });
      } else {
        fs.push({ type: "pctrows", pg: 1, source: "options" + sfx, prefix: "prob_d" + di + "_",
          headLeft: "潜在结果（在右侧填你估计的概率）" });
        fs.push({ key: "know_d" + di, pg: 1, label: "你知道的信息", type: "list", half: true, itemPlaceholder: "已掌握的事实、数据、经验……", emptyHint: "点击下方按钮按需添加",
          hint: "下面三问解释的是上面所有这些概率估计，不必逐个结果写。" });
        fs.push({ key: "unknow_d" + di, pg: 1, label: "你不知道的信息", type: "list", half: true, itemPlaceholder: "缺失的、不确定的信息……", emptyHint: "点击下方按钮按需添加" });
        fs.push({ key: "probwhy_d" + di, pg: 1, label: "你为什么这样评估概率？", type: "textarea", placeholder: "例：根据以往经验，这类情况大约四成会发生；但团队执行力是未知数……" });
      }
      /* ③ 组内比较 */
      if (!opts.length) {
        fs.push({ type: "note", pg: 2, label: "还没有潜在结果", text: "请先在本页的“可能结果”环节添加潜在结果，再回来比较。" });
      } else {
        fs.push({ type: "sumlist", pg: 2, source: "options" + sfx, probPrefix: "prob_d" + di + "_",
          label: "回顾前两个环节的判断：偏好排序（从上到下 = 更偏好）与每个结果的估计概率" });
        fs.push({ key: "pick" + sfx, pg: 2, label: "综合比较（可能结果 × 可能性）：这个决策下，你的第一选择是？", type: "radio", options: opts.map((o, j) => ["opt" + j, "结果 " + (j + 1) + "：" + o.t]) });
        fs.push({ key: "reason" + sfx, pg: 2, label: "选择理由", type: "textarea", placeholder: "例：它的上行潜力足以抵消下行风险，且可能性分布更有利。" });
      }
      return fs;
    }
    return [];
  }
};

/* ---------- 模块三：内外视角（移植自 perspective，第六章，原 ls 前缀 pv） ---------- */
/* ---------- 内外视角：多组观点追踪（vt_groups 与 cal_groups 索引对齐） ---------- */
function pvNorm(v) {
  if (!v || typeof v !== "object") return v;
  /* 旧结构兼容：单组的外/内视角与校准结论包装成第 1 组（不丢历史数据） */
  if (!Array.isArray(v.vt_groups)) {
    const out = Array.isArray(v.outside_views) ? v.outside_views : [];
    const ins = Array.isArray(v.inside_views) ? v.inside_views : [];
    const cal = { same_way: v.same_way || "", deviate: v.deviate || "", calibrated: v.calibrated || "", conclusion: v.conclusion || "" };
    const hasVt = out.length || ins.length;
    const hasCal = Object.keys(cal).some(k => String(cal[k] || "").trim());
    v.vt_groups = hasVt ? [{ name: "", outside_views: out, inside_views: ins }] : [];
    v.cal_groups = hasCal ? [cal] : [];
    delete v.outside_views; delete v.inside_views;
    delete v.same_way; delete v.deviate; delete v.calibrated; delete v.conclusion;
  }
  if (!Array.isArray(v.cal_groups)) v.cal_groups = [];
  if (!v.vt_groups.length) v.vt_groups.push({ name: "", outside_views: [], inside_views: [] });
  v.vt_groups = v.vt_groups.map(g => (g && typeof g === "object") ? g : {});
  v.vt_groups.forEach(g => {
    if (!Array.isArray(g.outside_views)) g.outside_views = [];
    if (!Array.isArray(g.inside_views)) g.inside_views = [];
    if (g.name == null) g.name = "";
  });
  v.cal_groups = v.cal_groups.map(g => (g && typeof g === "object") ? g : {});
  while (v.cal_groups.length < v.vt_groups.length) v.cal_groups.push({});
  if (v.cal_groups.length > v.vt_groups.length) v.cal_groups.length = v.vt_groups.length;
  return v;
}
function pvVtGroups(v) { pvNorm(v); return Array.isArray(v.vt_groups) ? v.vt_groups : []; }
function pvGroupName(g, i) {
  const n = String((g && g.name) || "").trim();
  return n || ("观点 " + (i + 1));
}
/* 取某一组的数据对象（kind: "vt" | "cal"），create=false 时不存在则返回空对象 */
function pvGroupObj(mv, kind, i, create) {
  if (!mv || typeof mv !== "object") return {};
  pvNorm(mv);
  const arr = kind === "cal" ? mv.cal_groups : mv.vt_groups;
  const idx = Number(i) || 0;
  if (arr[idx] && typeof arr[idx] === "object") return arr[idx];
  if (!create) return {};
  arr[idx] = kind === "cal" ? {} : { name: "", outside_views: [], inside_views: [] };
  return arr[idx];
}
/* 各组结论汇总（报告章末用） */
function pvConclusions(mv) {
  pvNorm(mv);
  const parts = [];
  mv.cal_groups.forEach((g, i) => {
    const c = String((g && g.conclusion) || "").trim();
    if (c) parts.push(pvGroupName(mv.vt_groups[i], i) + "：" + c);
  });
  return parts.join("；");
}

/* ---------- 模块作用域（泛化自 pre-mortem 的轮次 scope） ---------- */
function selOf(v) {

/* 流程描述（回顾/报告/文字共用）：默认流程一句话，自定义按 sel 顺序 */
function flowText(o) {

  if (!values.mods || typeof values.mods !== "object") values.mods = {};

}
function peekModScope(mv, idx) {
  idx = Number(idx) || 0;
  if (idx === 0) return mv;
  const rounds = Array.isArray(mv._rounds) ? mv._rounds : [];
  return rounds[idx - 1] || {};
}
/* scope 字符串："root"（会话级）/ "base"（全局基准库）/ "m:xx"（模块第 1 轮）/ "m:pm@N"（pm 第 N+1 轮） */
function resolveScope(str, create) {
  if (str === "root") return values;
  if (str === "base") return baseline;
  const m = /^m:(\w+)(?:@(\d+))?$/.exec(String(str || ""));
  if (!m) return values;
  const mv = ensureModScope(m[1]);
  const r = Number(m[2]) || 0;
  if (r === 0) return mv;
  if (!Array.isArray(mv._rounds)) {
    if (!create) return {};
    mv._rounds = [];
  }
  if (create) while (mv._rounds.length < r) mv._rounds.push({});
  const scope = mv._rounds[r - 1];
  if (scope && typeof scope === "object") return scope;
  if (create) { mv._rounds[r - 1] = {}; return mv._rounds[r - 1]; }
  return {};
}
function persistScope(str) {

}

/* ---------- 路径组装器：s0 + 按勾选顺序拼接各模块内部路径 ---------- */
function buildPath(v) {
  const p = [{ mod: null, step: S0_STEP }];
  selOf(v).forEach(m => {
    moduleSteps(m, (v.mods && v.mods[m]) || {}).forEach(st => p.push({ mod: m, step: st }));
  });
  return p;
}
function moduleSteps(m, mv) {
  const mod = MODS[m];
  if (m === "dp") return mod.pathIds(mv).map(id => DP_STEP_MAP[id]).filter(Boolean);
  if (mod.path) return mod.path(mv);
  return mod.steps.slice();
}
function scopeStrFor(entry, roundOverride) {
  if (!entry.mod) return "root";
  if (entry.mod === "pm") {
    const r = roundOverride != null ? roundOverride : pmRound;
    return r > 0 ? "m:pm@" + r : "m:pm";
  }
  return "m:" + entry.mod;
}
function fieldsForEntry(entry, scopeVals) {
  if (!entry.mod) return S0_FIELDS;
  return MODS[entry.mod].fields(entry.step.id, scopeVals || {}) || [];
}
function stepMetaFor(entry, scopeVals) {
  if (!entry.mod) return "";
  const mod = MODS[entry.mod];
  const base = String(entry.step.id).replace(/_d\d+$/, "");
  const m = mod.stepMeta && mod.stepMeta[base];
  if (!m) return "";
  return typeof m === "function" ? m(scopeVals || {}) : m;
}

/* ---------- 推进门槛（ss 的 gateOk 泛化：titleStep + need 支持函数或字段 key） ---------- */
function gateOk(entry) {
  if (!entry.mod) {
    return !!String(values.title || "").trim() && (values.flowmode === "default" || selOf(values).length >= 1);
  }
  const mod = MODS[entry.mod];
  const scope = resolveScope(scopeStrFor(entry), false);
  const baseId = entry.step.base || entry.step.id;
  if (mod.titleStep && baseId === mod.titleStep && !String(scope[mod.titleKey] || "").trim()) return false;
  if (entry.step.need) {
    return typeof entry.step.need === "function"
      ? !!entry.step.need(scope)
      : !!String(scope[entry.step.need] == null ? "" : scope[entry.step.need]).trim();
  }
  return true;
}
function gateHint(entry) {

  const mod = MODS[entry.mod];

/* ---------- 跨模块预填（仅当目标字段为空时填，每条规则每次会话只填一次，用户可改） ---------- */
function applyPrefills(modId) {
  const done = values._prefilled || (values._prefilled = {});
  const mv = ensureModScope(modId);
  const sel = selOf(values);
  const t = String(values.title || "").trim();
  const fill = (key, val) => {
    const kk = modId + "." + key;
    if (done[kk]) return;
    done[kk] = 1;
    if (val == null) return;
    if (typeof val === "string" && !val.trim()) return;
    if (Array.isArray(val) && !val.length) return;
    const cur0 = mv[key];
    if (cur0 != null && cur0 !== "" && !(Array.isArray(cur0) && cur0.length === 0)) return;
    mv[key] = val;
  };
  if (modId === "pv") {
    fill("title", t);
  }
  if (modId === "ss") {
    /* 本次决策＝决策速度第 1 步「这个决策具体是什么？」，它就是第 1 个决策（不进候选数组） */
    const t0 = dpDecisionText();
    if (t0 && !String(mv.title || "").trim()) mv.title = t0;
    if (sel.indexOf("dp") >= 0) {
      /* 决策速度「披着狼皮的羊」环节列过的候选选项自动带入候选数组（去重，且不与本次决策重复）。
         只在真的带入新条目时改写数组——否则每次渲染都会把用户刚添加的空行冲掉 */
      const dpm = ensureModScope("dp");
      const opts = (Array.isArray(dpm.options_extra) ? dpm.options_extra : []).filter(o => (o.t || "").trim());
      if (opts.length) {
        const curD = Array.isArray(mv.decisions) ? mv.decisions : [];
        const known = curD.map(d => String((d && d.t) || "").trim()).concat([String(t0 || "").trim()]);
        let added = 0;
        opts.forEach(o => {
          const txt = String(o.t).trim();
          if (known.indexOf(txt) < 0) { curD.push({ t: o.t }); known.push(txt); added++; }
        });
        if (added) mv.decisions = curD;
      }
      if (!String(mv.bg || "").trim()) fill("bg", dpm.situation || "");
    }
    fill("bg", t0);
  }
  if (modId === "pm") {
    fill("title", t);
  }
}
/* ss 的 final_pick 值是 "d0" 形式，预填时还原为决策文本 */
/* 六步决策「最终选择」里勾选的所有决策，带决策编号逐条列出（与「决策 N：…」口径一致） */

/* ---------- 跨模块同源文本：决策速度第 1 步与六步决策第 1 步共用 ---------- */
/* ① 本次决策：唯一真值来源＝决策速度第 1 步的决策陈述（dp.title）；未走决策速度时退回会话名。
   六步决策的“本次决策”文本框实时读这里，改哪边都写回这里，候选列表第 1 条（决策 1）同步为它。 */
function dpDecisionText() {
  const dp = (values && values.mods && values.mods.dp) || {};
  return String(dp.title || "").trim() || String((values && values.title) || "").trim();
}
function syncDecisionText() {
  if (!values || !values.mods) return;
  const t = dpDecisionText();
  if (!t) return;
  const ss = values.mods.ss;
  if (ss && typeof ss === "object") {
    ss.title = t;

    if (Array.isArray(ss.decisions) && ss.decisions.length && ss.decisions[0] && String(ss.decisions[0].t || "").trim() === t) ss.decisions.shift();
    saveDraft();

/* ② 背景描述：决策速度第 1 步「具体描述你当前的处境」（dp.situation）＝六步决策第 1 步「背景描述」（ss.bg）。
   两侧同义，以决策速度为锚：任一侧为空时由另一侧补齐，两侧都有时以决策速度为准（与①同一口径）。 */
/* ③ 内外视角 / 事前验尸：与最初环节（决策速度）同源——名字＝决策陈述，描述＝具体决策＋当前处境。
   只在「与其它工具同用」时启用；单独使用某个工具时一切照旧（自己填名字与描述）。
   名字与①同一口径（改哪边都会更新）；描述默认带入，在这里改过之后就以这里为准，不再被覆盖。 */
function combined() {

}
function dpSituationText() {
  const dp = (values && values.mods && values.mods.dp) || {};
  return String(dp.situation || "").trim();
}
function dpContextText() {
  const parts = [];

  if (d) parts.push("决策：" + d);

  if (s) parts.push("当前处境：" + s);
  return parts.join("\n");
}
/* 把一个作用域的 title / 描述字段同步为最初环节的内容（描述改过就不覆盖），返回是否有改动 */
function syncFromInitial(scope, descKey) {
  if (!scope || typeof scope !== "object") return false;
  const t = dpDecisionText();
  const d = dpContextText();
  const markKey = "_synced_" + descKey;
  let changed = false;
  if (t && scope.title !== t) { scope.title = t; changed = true; }
  /* 描述：为空、或仍是上一次同步过来的内容（说明没在这里改过）时，跟着最初环节更新 */
  if (d && (!String(scope[descKey] || "").trim() || scope[descKey] === scope[markKey])) {
    if (scope[descKey] !== d || scope[markKey] !== d) { scope[descKey] = d; scope[markKey] = d; changed = true; }
  }

}
/* 内外视角自己填「决策 / 处境」两问的场合：单独使用它，或把它排在第一个（前面没有上游工具）。
   其余情况（默认流程等）这两问从最初环节带入，向导里不再重复展示，但报告里照常收录。 */
/* 某个模块前面是否还有别的工具（按 sel 顺序）：有上游 = 上下文由上游带入，本环节不重复问 */
function upstreamOf(modId) {
  return selOf(values).indexOf(modId) > 0;
}
/* 决策速度是否排在指定模块前面（决定与处境的实际来源） */
function dpBefore(modId) {
  const sel = selOf(values);
  const d = sel.indexOf("dp"), i = sel.indexOf(modId);
  return d >= 0 && i >= 0 && d < i;
}
function pvSelfInput() {
  return !upstreamOf("pv");
}
function syncPvText() {
  if (!values || !values.mods || pvSelfInput()) return;
  if (syncFromInitial(values.mods.pv, "problem")) saveDraft();
}
/* 事前验尸要验的计划：默认取六步决策「最终选择」勾选的决策；还没勾选则退回最初环节的决策与处境 */
function pmPlan() {
  return { text: ssPickText((values && values.mods && values.mods.ss) || {}) };
}
function syncPmText() {
  if (!values || !values.mods || !upstreamOf("pm")) return;
  const pm = values.mods.pm;
  if (!pm || typeof pm !== "object") return;
  const t = dpDecisionText();
  const plan = pmPlan().text;
  let changed = false;
  /* 名字与计划都是只读投射：一律以上游为准（旧报告里的历史内容也要被覆盖掉） */
  [pm].concat(Array.isArray(pm._rounds) ? pm._rounds : []).forEach(scope => {
    if (!scope || typeof scope !== "object") return;
    if (t && scope.title !== t) { scope.title = t; changed = true; }
    if (String(scope.goal_desc || "") !== plan) { scope.goal_desc = plan; changed = true; }
  });
  if (changed) saveDraft();
}
function syncBgText() {
  if (!values || !values.mods) return;
  const dp = values.mods.dp || {};
  const ss = values.mods.ss || {};
  const d = String(dp.situation || "").trim() ? dp.situation : "";
  const b = String(ss.bg || "").trim() ? ss.bg : "";
  const t = d || b;
  if (!t) return;
  let changed = false;
  if (d !== t) { dp.situation = t; changed = true; }
  if (b !== t) { ss.bg = t; changed = true; }
  if (changed) saveDraft();
}
/* 会话标题变化：同步到六步决策的决策 1（决策速度未填时它是退路） */
function syncRootKeyToDerived(k) {
  if (k === "title") syncDecisionText();
}
/* 六步决策第 1 步编辑“本次决策”：写回决策速度第 1 步的决策陈述，并同步决策 1。
   两处同源文本在一侧被编辑时写回另一侧的存值（含清空），使两侧始终是同一份文本。 */
function syncDerivedKey(k, scopeStr, val) {
  if (!values) return;
  if (scopeStr === "m:ss" && k === "title") {
    ensureModScope("dp").title = val;
    syncDecisionText();
    return;
  }
  if (k === "situation" && scopeStr === "m:dp") ensureModScope("ss").bg = val;
  else if (k === "bg" && scopeStr === "m:ss") ensureModScope("dp").situation = val;
  else if (k === "title" && (scopeStr === "m:pv" || scopeStr === "m:pm" || /^m:pm@\d+$/.test(scopeStr))) {
    if (!combined()) return;
    ensureModScope("dp").title = val;
    syncDecisionText();
  } else return;
  saveDraft();
}
/* 同源文本的孪生输入框：若另一处（如右侧回顾卡）正显示同一字段，同步刷新它的显示值 */
const TWIN_FIELDS = { "m:ss|bg": "m:dp|situation", "m:dp|situation": "m:ss|bg" };
function mirrorTwinEl(root, k, scopeStr, val) {
  const twin = TWIN_FIELDS[scopeStr + "|" + k];
  if (!twin) return;
  const p = twin.split("|");
  root.querySelectorAll('[data-k="' + p[1] + '"]').forEach(x => {
    if ((x.dataset.scope || "root") !== p[0] || x.value === val) return;
    x.value = val;
    if (x.tagName === "TEXTAREA") growEl(x);
  });
}

function render() {
  if (view === "home") renderHome();
  else if (view === "baseline") renderBaseline();
  else if (view === "wizard") renderWizard();
  else if (view === "report") renderReport();
  else if (view === "followup") renderFollowup();
  growTextareas(app);
  if (resetScrollNext) window.scrollTo(0, 0);
  resetScrollNext = false;
}
function goRender() { resetScrollNext = true; render(); }

function growTextareas(root) {
  root.querySelectorAll("textarea").forEach(growEl);
}
function growEl(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}

/* ---------- 首页 ---------- */
function renderHome() {
  const draft = loadDraft();
  const hasDraft = draft && draft.v && (String(draft.v.title || "").trim() || selOf(draft.v).length);
  let reportsHtml = "";
  if (reports.length === 0) {
    reportsHtml = '<p class="empty-hint">还没有已保存的' + esc(CONF.noun) + '报告。走完向导流程后，报告会出现在这里。</p>';
  } else {
    reportsHtml = reports.map((r, i) => {
      const sel = Array.isArray(r.sel) ? r.sel : [];
      const tags = sel.map(m => MODS[m] ? '<span class="ri-tag" style="background:' + MODS[m].color + ';">' + esc(MODS[m].name) + '</span>' : "").join("");
      const vds = sel.map(m => {
        if (!MODS[m] || !r.mods || !r.mods[m]) return "";
        const vd = MODS[m].verdict(r.mods[m]);
        return vd && vd.t ? vd.t : "";
      }).filter(Boolean).join(" ｜ ");
      const fuCount = Array.isArray(r.followups) ? r.followups.length : 0;
      return '<div class="report-item">' +
        '<div class="ri-main" data-open="' + i + '">' +
          '<div class="ri-title">' + esc(r.title || "未命名") + '</div>' +
          '<div class="ri-meta">' + esc(r.date) + (r.updated ? ' · 更新于 ' + esc(r.updated) : "") + ' ' + tags + (vds ? '<span>' + esc(vds) + '</span>' : "") + (fuCount ? '<span>· 已追加评估 ' + fuCount + ' 次</span>' : "") + '</div>' +
        '</div>' +
        (sel.indexOf("pm") >= 0 ? '<button class="btn secondary" style="padding:6px 14px;font-size:12.5px;flex-shrink:0;" data-fu="' + i + '">追加评估</button>' : "") +
        '<button class="btn secondary" style="padding:6px 14px;font-size:12.5px;flex-shrink:0;" data-editrep="' + i + '">编辑</button>' +
        '<button class="btn danger-ghost" data-del="' + i + '">删除</button>' +
      '</div>';
    }).join("");
  }

  const flowHtml = '<div class="flow-grid">' + MODULE_LIST.map((m, mi) =>
    '<div class="flow-card" style="border-top-color:' + m.color + ';">' +
      '<h4>' + esc(m.name) + '</h4>' +
      '<div class="fc-src">' + esc(m.src) + '</div>' +
      '<div class="fc-desc">' + esc(m.desc) + '</div>' +
    '</div>').join("") + '</div>';

  app.innerHTML =
    '<div class="narrow">' +
    '<div class="hero">' +
      '<div class="kicker">' + esc(CONF.kicker) + '</div>' +
      '<h1>' + esc(CONF.h1) + '</h1>' +
      CONF.intro.map(p => '<p>' + esc(p) + '</p>').join("") +
      '<p>默认流程（可一键选用，也可在起始步自由勾选排序）：</p>' +
      flowHtml +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">' +
        '<button class="btn" id="btn-start">' + (hasDraft ? (draftEditTarget(draft) ? "继续编辑报告（" : "继续上次的" + esc(CONF.noun) + "（") + esc(String(draft.v.title || "未命名")) + "）" : CONF.startLabel) + '</button>' +
        (hasDraft ? '<button class="btn secondary" id="btn-fresh">重新开始</button>' : "") +
        '<button class="btn secondary" id="btn-baseline">个人判断基准库</button>' +
      '</div>' +
    '</div>' +

    '<div class="report-list">' +
      '<h2>已保存的' + esc(CONF.noun) + '报告</h2>' + reportsHtml +
    '</div>' +
    '</div>';

  document.getElementById("btn-start").onclick = () => {
    const d = loadDraft();
    /* 新会话默认推荐「默认流程」（多数用户没完整读过这本书），可再自己改成组合 */
    values = d ? d.v : { flowmode: "default", sel: DEFAULT_SEL.slice() };
    pmRound = d ? (Number(d.r) || 0) : 0;
    cur = d ? (Number(d.c) || 0) : 0;
    editingReport = d ? draftEditTarget(d) : null;
    if (pmRound > 0) resolveScope("m:pm@" + pmRound, true);
    reviewEdit = -1; rightTab = null; subTab = 0; pvTab = 0;
    view = "wizard"; goRender();
  };
  const fresh = document.getElementById("btn-fresh");
  if (fresh) fresh.onclick = () => {
    /* 重新开始同样默认推荐「默认流程」 */
    values = { flowmode: "default", sel: DEFAULT_SEL.slice() }; pmRound = 0; cur = 0; editingReport = null; suspendedDraft = null; saveDraft();
    reviewEdit = -1; rightTab = null; subTab = 0; pvTab = 0;
    view = "wizard"; goRender();
  };
  document.getElementById("btn-baseline").onclick = () => { view = "baseline"; goRender(); };
  app.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => { viewingReport = reports[Number(el.dataset.open)]; view = "report"; goRender(); };
  });
  app.querySelectorAll("[data-fu]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      followupReport = reports[Number(el.dataset.fu)];
      fuVals = {}; fuSummary = "";
      view = "followup"; goRender();
    };
  });
  app.querySelectorAll("[data-editrep]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      startEditReport(reports[Number(el.dataset.editrep)]);
    };
  });
  app.querySelectorAll("[data-del]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      if (!confirm("确定删除这份报告吗？此操作不可撤销。")) return;
      reports.splice(Number(el.dataset.del), 1);
      persistReports(); render();
    };
  });
}

/* ---------- 个人判断基准库（pv 判断基准，全局长期保存，编辑即存） ---------- */

    '<div class="narrow">' +
    '<div class="hero">' +
      '<div class="kicker">长期保存 · 编辑即存</div>' +

      '<p>来自「内外视角校准」（《对赌（实践版）》第六章）——只需认真填写一次，长期保存；每次走内外视角模块时，第 1 步默认回顾这里的内容，可选择更新编辑。所有修改即时保存，并与独立的「观点跟踪」单文件工具共享。</p>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">' +

      '</div>' +
    '</div>' +
    '<div class="step-card"><div class="step-body">' +
      renderFields(MOD_PV.fields("s1", baseline) || [], false, "base") +
    '</div></div>' +
    '</div>';
