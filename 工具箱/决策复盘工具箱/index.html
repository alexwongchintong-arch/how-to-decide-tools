<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>决策复盘工具箱 · 四阶段完整复盘 — 基于《对赌（实践版）》</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f4;
    --surface: #ffffff;
    --border: #e6e3dd;
    --text: #1a1a1a;
    --text-secondary: #55534f;
    --text-muted: #999590;
    --accent: #1a56db;
    --accent-soft: #eaf0fd;
    --success: #1a7f3f;
    --success-soft: #e9f5ec;
    --warning: #b85415;
    --warning-soft: #fdf1e7;
    --danger: #c02a2a;
    --radius: 8px;
    --radius-sm: 5px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  .container { max-width: none; margin: 0 auto; padding: 24px 32px 80px; }
  .narrow { max-width: 1080px; margin-left: auto; margin-right: auto; }

  .hero, .report-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 30px 32px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .hero .kicker { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 8px; }
  .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 14px; }
  .hero p { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
  .hero ol { padding-left: 22px; font-size: 13.5px; color: var(--text-secondary); margin: 2px 0 4px; }
  .hero ol li { margin-bottom: 6px; }
  .hero ol li strong { color: var(--text); }
  .hero ol li::marker { color: var(--accent); font-weight: 700; }
  .question-box { background: var(--accent-soft); border-left: 3px solid var(--accent);
                  border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 16px; margin: 16px 0; font-size: 14px; }
  .question-box strong { color: var(--accent); }
  .report-list h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  /* 首页四阶段流程示意 */
  .flow-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .flow-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
               background: #fcfbfa; border-top: 3px solid var(--accent); }
  .flow-card h4 { font-size: 13px; margin-bottom: 6px; }
  .flow-card ul { padding-left: 16px; font-size: 12px; color: var(--text-secondary); }
  .flow-card ul li { margin-bottom: 3px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; transition: background 0.12s;
  }
  .btn:hover { background: #1646b0; }
  .btn.secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn.secondary:hover { background: #f0efec; }
  .btn.danger-ghost { background: transparent; color: var(--danger); border: 1px solid transparent; font-weight: 500; padding: 6px 12px; }
  .btn.danger-ghost:hover { background: #fbeaea; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* 每份复盘用圆角卡片隔开，多份报告时一眼能分清 */
  .report-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
                 background: #fcfbfa; margin-bottom: 10px; transition: border-color 0.12s, background 0.12s; }
  .report-item:last-child { margin-bottom: 0; }
  .report-item:hover { border-color: var(--accent); background: #fff; }
  .report-item .ri-main { flex: 1; cursor: pointer; min-width: 0; }
  .report-item .ri-title { font-size: 14px; font-weight: 600; }
  .report-item .ri-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .report-item .ri-concl { color: var(--text-secondary); }
  .report-item .ri-concl.empty { color: var(--text-muted); font-style: italic; }
  .empty-hint { font-size: 13px; color: var(--text-muted); }

  /* 两层步骤条：上层阶段 chip，下层当前阶段内步骤 chip */
  .phase-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  /* 编辑已保存报告时的提示条：说明会覆盖哪一份，并给一个随时退出的出口 */
  .edit-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                 background: var(--accent-soft); border: 1px solid #c9d9f8; border-radius: var(--radius-sm);
                 padding: 9px 14px; margin-bottom: 12px; font-size: 13px; color: #1b3f9e; }
  .edit-banner .btn { padding: 5px 14px; font-size: 12.5px; }
  .phase-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12.5px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .phase-chip .pdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .phase-chip.active { font-weight: 700; color: var(--text); }
  .phase-chip.done { color: var(--text-secondary); }

  .stepper { display: flex; align-items: center; gap: 4px; margin-bottom: 22px; flex-wrap: wrap; }
  .step-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; white-space: nowrap;
  }
  .step-chip .num { width: 17px; height: 17px; border-radius: 50%; background: #eceae6;
                    display: inline-flex; align-items: center; justify-content: center;
                    font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
  .step-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .step-chip.active .num { background: var(--accent); color: #fff; }
  .step-chip.done { color: var(--success); }
  .step-chip.done .num { background: var(--success); color: #fff; }
  .step-sep { color: #d4d1cb; font-size: 11px; }

  /* 决策切换器（逐决策步骤顶部） */
  .dec-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  .dec-bar.sm { margin-bottom: 12px; padding-bottom: 10px; }
  .dec-bar.sm .dec-pill { max-width: 200px; padding: 4px 10px; font-size: 11.5px; }
  .dec-pill { max-width: 320px; }
  .dec-pill-txt { overflow: hidden; text-overflow: ellipsis; }

  .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: var(--shadow); overflow: hidden; }
  .step-head { padding: 24px 32px 18px; border-bottom: 1px solid var(--border); }
  .step-head .tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent);
                    background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .step-head h2 { font-size: 20px; font-weight: 700; }
  .step-body { padding: 24px 32px 32px; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  /* 斜角切换键（页签 / 阶段键）统一造型：向左倾的斜角标签 + 1px 同色描边 + 上圆角。
     斜边用 skewX 实现（竖边倾斜、上下边仍水平，底边贴着面板线不动），
     内层 span 反向 skew 把文字摆正。 */
  .bevel-btn {
    border: 1px solid var(--bc); border-radius: 6px 6px 0 0; background: var(--bf, #fff);
    color: var(--bc); cursor: pointer; font-family: inherit; padding: 0;
    transform: skewX(-16deg); transform-origin: bottom left;
    transition: background 0.12s, color 0.12s;
  }
  .bevel-btn > span {
    display: block; font-size: 13px; font-weight: 600; padding: 4px 15px 5px;
    transform: skewX(16deg); transform-origin: bottom left;
  }
  /* 「回顾 / 基准」页签：各用一种颜色（回顾=蓝，基准=紫），选中/悬停时换上同色浅底 */
  .aux-tabs { display: flex; gap: 4px; padding-left: 6px; margin-bottom: -1px; }
  .aux-tab { --bc: var(--accent); --bt: var(--accent-soft); }
  .aux-tab[data-aux="base"] { --bc: #6d5a9e; --bt: #efecf5; }
  .aux-tab:hover, .aux-tab.active { --bf: var(--bt); }
  .aux-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .review-col.aux { gap: 0; }
  .review-col { display: flex; flex-direction: column; gap: 16px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 box-shadow: var(--shadow); overflow: hidden; }
  .review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 padding: 12px 18px; border-bottom: 1px solid var(--border); background: #faf9f7; }
  .review-head h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
  .btn-edit { border: 1px solid var(--border); background: #fff; color: var(--accent); font-size: 12px;
              font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .btn-edit:hover { border-color: var(--accent); }
  .btn-edit.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rv-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rv-nav h3 { font-size: 13px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-arrow { border: 1px solid var(--border); background: #fff; color: var(--text-secondary); font-size: 14px; line-height: 1; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
  .rv-arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .rv-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
  /* 回顾栏内的阶段切换键：同款梯形，按阶段主题色描边，还没走到的阶段灰掉 */
  .rv-phases { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px;
               border-bottom: 1px dashed var(--border); }
  .rv-phase { --bc: var(--pc); --bt: var(--pt); }
  .rv-phase > span { font-size: 12px; font-weight: 600; padding: 4px 13px 5px; }
  .rv-phase:hover:not(:disabled), .rv-phase.active { --bf: var(--bt); }
  .rv-phase:disabled { --bc: #b9b5af; --bf: #f3f2f0; cursor: not-allowed; }
  .rv-phase:disabled > span { color: var(--text-muted); }
  .review-body { padding: 16px 18px 20px; font-size: 13.5px; }
  .review-body .field { margin-bottom: 16px; }
  .review-body textarea { min-height: 54px; font-size: 13px; }
  .locked { opacity: 0.82; }
  .locked input, .locked textarea { background: #faf9f7; border-color: transparent; color: var(--text-secondary);
                                    box-shadow: none !important; }
  .locked .yn-btn, .locked .as-btn, .locked .radio-option, .locked .list-add, .locked .row-remove,
  .locked .score-btn, .locked .chip, .locked .qcell-pick, .locked .eval-sel { pointer-events: none; }

  .field { margin-bottom: 26px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; display: block; }
  .field-label .opt-name { color: var(--accent); }
  .field-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .meta-note { background: #faf9f7; border: 1px dashed var(--border); border-radius: var(--radius-sm);
               padding: 8px 12px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; }
  .half-row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
  .half-row .field.half { flex: 1; min-width: 0; margin-bottom: 0; }
  .sub-title { font-size: 13.5px; font-weight: 700; color: var(--text); border-left: 3px solid var(--accent); padding-left: 8px; padding-top: 2px; }
  .field-label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .help-btn { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); background: #fff; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1; flex-shrink: 0; padding: 0; }
  .help-btn:hover { border-color: var(--accent); }
  input[type="text"], textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
  textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-option {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
    transition: all 0.12s; font-size: 13.5px;
  }
  .radio-option:hover { border-color: var(--accent); }
  .radio-option.checked { border-color: var(--accent); background: var(--accent-soft); }
  .radio-option input { margin-top: 3px; accent-color: var(--accent); }
  .radio-option .opt-desc { color: var(--text-muted); font-size: 12px; display: block; }
  /* 只有两个选项的判断题：左右并排，省掉一整行空白（窄屏仍竖排） */
  .radio-group.inline { flex-direction: row; gap: 10px; }
  .radio-group.inline .radio-option { flex: 1 1 0; min-width: 0; }

  .score-row { display: flex; gap: 8px; align-items: center; }
  .score-btn {
    width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: #fff; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text-secondary);
    transition: all 0.12s;
  }
  .score-btn:hover { border-color: var(--accent); }
  .score-btn.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .score-endlabel { font-size: 11.5px; color: var(--text-muted); width: 74px; line-height: 1.4; }
  .score-endlabel.right { text-align: right; color: var(--accent); }

  .list-rows { display: flex; flex-direction: column; gap: 10px; }
  .list-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fcfbfa;
              display: flex; gap: 10px; align-items: flex-start; }
  .list-row .idx { font-size: 12px; color: var(--text-muted); font-weight: 700; padding-top: 9px; flex-shrink: 0; }
  .list-row textarea { flex: 1; resize: none; overflow: hidden; min-height: 40px; padding: 7px 10px; font-size: 13.5px; }
  .row-cmp { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
  .row-cmp .chip { padding: 4px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 999px;
                   cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .row-cmp .chip:hover { border-color: var(--accent); }
  .row-cmp .chip.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row-remove { flex-shrink: 0; border: none; background: transparent; color: var(--text-muted);
                cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; line-height: 1; }
  .row-remove:hover { color: var(--danger); background: #fbeaea; }
  .list-add { border: 1px dashed var(--border); background: transparent; color: var(--accent);
              padding: 9px; width: 100%; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; margin-top: 10px; }
  .list-add:hover { border-color: var(--accent); background: var(--accent-soft); }
  .list-empty-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

  .as-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .as-item { font-size: 13.5px; margin-bottom: 8px; }
  /* 判定后就地展开的追问清单：两条并排，只有一条时占满整宽 */
  .as-notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px;
              margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .as-notes > .as-note:only-child { grid-column: 1 / -1; }
  .as-note-cap { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .as-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .as-btn { padding: 4px 16px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 999px;
            cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .as-btn:hover { border-color: var(--accent); }
  .as-btn.picked-1 { background: var(--accent); border-color: var(--accent); color: #fff; }
  .as-btn.picked-2 { background: #7a86a8; border-color: #7a86a8; color: #fff; }
  .as-btn.picked-3 { background: #eceae6; border-color: #d4d1cb; color: var(--text-secondary); }

  /* ---------- perspective 特有：基准数三联行 / 内外视角双栏 ---------- */
  .tri-sub { display: flex; gap: 8px; }
  .tri-sub input { flex: 1; min-width: 0; }
  .vt-title { text-align: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .vt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .vt-col { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; background: #fff; min-width: 0; }
  .vt-col h4 { font-size: 13.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .vt-col .vt-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
  .vt-inside h4 { color: var(--warning); }
  /* 观点追踪多组：每组一张小卡，顶部命名 + 删除 */
  .vt-group { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; background: #fcfbfa; margin-bottom: 14px; }
  .vt-group-head { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 12px; }
  .vt-group-name { flex: 1; min-width: 0; font-weight: 600; }
  .vt-group .vt-grid { gap: 10px; }
  .vt-outside h4 { color: var(--accent); }

  /* ---------- luck-box 特有：四象限坐标图 ---------- */
  .quad-chart {
    display: grid;
    grid-template-columns: 26px 1fr 1fr;
    grid-template-rows: 1fr 1fr 26px;
    gap: 8px;
  }
  .q-yaxis {
    grid-column: 1; grid-row: 1 / 3;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 4px 0;
  }
  .q-yaxis .ylab { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .q-yaxis .ytitle { writing-mode: vertical-rl; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.15em; }
  .q-xaxis {
    grid-column: 2 / 4; grid-row: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
  }
  .q-xaxis .xlab { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .q-xaxis .xtitle { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.15em; }
  .qcell {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
    background: #fcfbfa; min-height: 150px; display: flex; flex-direction: column;
  }
  .qc-head { display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
  .qc-num { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .qc-name { font-size: 14.5px; font-weight: 700; }
  .qc-axis { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .qc-def { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .qc-ex { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  .qc-ex b { color: var(--text-secondary); font-weight: 600; }
  .qcell textarea { min-height: 52px; font-size: 12.5px; flex: none; resize: none; overflow: hidden; }
  .cell-deserved .qc-name { color: var(--success); }
  .cell-goodluck .qc-name { color: var(--warning); }
  .cell-badluck .qc-name { color: var(--accent); }
  .cell-fault .qc-name { color: var(--danger); }
  .qcell-pick { cursor: pointer; position: relative; transition: all 0.12s; justify-content: flex-start; }
  .qcell-pick:hover { border-color: var(--accent); }
  .qcell-pick.checked { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px rgba(26,86,219,0.18); }
  .qcell-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .qc-pickmark { font-size: 11px; color: var(--accent); font-weight: 700; margin-top: auto; padding-top: 6px; visibility: hidden; }
  .qcell-pick.checked .qc-pickmark { visibility: visible; }
  /* 只读矩阵（右栏基准页签）：紧凑适配窄栏 */
  .quad-chart.sm { gap: 6px; }
  .quad-chart.sm .qcell { min-height: 0; padding: 8px 10px; }
  .quad-chart.sm .qc-name { font-size: 12.5px; }
  .quad-chart.sm .qc-axis { font-size: 10px; padding: 0 6px; }
  .quad-chart.sm .qc-ex { margin-bottom: 0; }

  /* 是/否题组 */
  .yn-block { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .yn-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .yn-q { font-size: 13.5px; flex: 1; }
  .yn-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .yn-btn { padding: 4px 16px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 999px;
            cursor: pointer; background: #fff; color: var(--text-secondary); user-select: none; }
  .yn-btn:hover { border-color: var(--accent); }
  .yn-btn.picked-yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .yn-btn.picked-no { background: #eceae6; border-color: #d4d1cb; color: var(--text-secondary); }
  .yn-note { margin-top: 10px; }
  .yn-note textarea { min-height: 48px; font-size: 13px; }

  /* ---------- knowledge-tracker 特有：概念卡 / 四栏知识流程 ---------- */
  .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 26px; }
  .concept-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; background: #fcfbfa; }
  .concept-card h4 { font-size: 14px; margin-bottom: 6px; }
  .concept-card .cc-def { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; }
  .concept-card .cc-ex { font-size: 12px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 8px; }
  .concept-card .cc-ex b { color: var(--text-secondary); font-weight: 600; }
  .cc-knew h4 { color: var(--warning); }
  .cc-should h4 { color: var(--danger); }
  .cc-reasonable h4 { color: var(--success); }

  /* 四栏里只有首尾两栏是输入区，中间「决策 / 结果」是只读带入的整句，
     所以把宽度让给首尾两栏（原来四栏等分，输入框只有 95px，一条短语要折三行） */
  .ktflow { display: grid; grid-template-columns: minmax(0, 1.5fr) 14px minmax(0, 0.85fr) 14px minmax(0, 0.85fr) 14px minmax(0, 1.6fr); gap: 4px; align-items: stretch; }
  .kt-arrow { display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; }
  .kt-col { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; background: #fff; min-width: 0; }
  .kt-col h5 { font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; line-height: 1.4; }
  .kt-col .kt-items { font-size: 12.5px; color: var(--text-secondary); }
  .kt-col .kt-items div { margin-bottom: 4px; }
  .kt-cap { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .kt-col .list-row { border: none; background: transparent; padding: 2px 0; }
  /* 每条之间用一条更深的虚线做分隔（原来跟卡片边框同色，太浅看不出来） */
  .kt-col .list-row textarea { border: none; border-bottom: 1px dashed #c1bcb1; border-radius: 0; background: transparent; font-size: 12.5px; padding: 4px 2px; }
  .kt-col .list-row textarea:focus { box-shadow: none; border-bottom-color: var(--accent); }
  .kt-col .row-remove { opacity: 0; transition: opacity 0.12s; width: 20px; padding: 4px 2px; }
  .kt-col .list-row:hover .row-remove { opacity: 1; }
  .kt-col .list-add { border: none; background: transparent; color: var(--accent); padding: 4px 0 0; margin-top: 2px; text-align: left; font-size: 12px; }
  .kt-col .list-add:hover { background: transparent; text-decoration: underline; }
  .kt-col .list-empty-hint { font-size: 11.5px; }

  /* ---------- counterfactual 特有：决策树 / 概率徽标 / 好坏标注 ---------- */
  .prob-badge { display: inline-block; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
                border-radius: 999px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
  .dtflow { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.9fr); gap: 14px; align-items: start; }
  .dt-decision, .dt-branches { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; min-width: 0; }
  .dt-decision h5, .dt-branch-head { font-size: 12.5px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; font-weight: 700; }
  .dt-decision .dt-text { font-size: 13px; color: var(--text-secondary); }
  .dt-actual { margin-top: 10px; border: 1px solid #f2e3b3; background: #fffbeb; border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 10px; align-items: flex-start; }
  .dt-actual .dt-actual-main { flex: 1; min-width: 0; }
  .dt-actual strong { display: block; font-size: 11px; color: #a07d1c; margin-bottom: 2px; }
  /* 实际分支文本与潜在结果行的 textarea 同款样式（虚线下划线、同字号内边距），保持两行版式一致 */
  .dt-actual-text { flex: 1; min-width: 0; font-size: 13px; padding: 4px 2px; border-bottom: 1px dashed var(--border);
                    line-height: 1.6; word-break: break-word; }
  /* 实际发生这一行嵌在黄色框里，而框自带 1px 边框 + 10px 内边距：
     输入行向左外扩 11px（= 边框 + 内边距）让概率框与下方潜在结果行对齐，
     黄框自身再向右延长 11px，于是「标注好坏」与黄框边框之间留出一个内边距，不会贴在一起；
     文字补回左内边距，仍在黄框内留白。 */
  .dt-actual { margin-right: -11px; }
  .dt-actual .dt-input-row { margin-left: -11px; }
  .dt-actual .dt-actual-text { padding-left: 13px; }
  .eval-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 1px; white-space: nowrap; }
  .eval-tag.eval-good { background: var(--success-soft); color: var(--success); }
  .eval-tag.eval-bad { background: #fbeaea; color: var(--danger); }
  .eval-tag.eval-neutral { background: #efedea; color: var(--text-secondary); }
  .dt-branch { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; }
  .dt-branch:last-of-type { margin-bottom: 4px; }
  .dt-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; padding-top: 4px; }
  .dt-branch-body { flex: 1; min-width: 0; }
  .dt-branch-body textarea { width: 100%; border: none; border-bottom: 1px dashed var(--border); border-radius: 0; background: transparent; font-size: 13px; padding: 4px 2px; resize: none; overflow: hidden; min-height: 0; }
  .dt-branch-body textarea:focus { outline: none; border-bottom-color: var(--accent); box-shadow: none; }
  .dt-input-row { display: flex; gap: 8px; align-items: flex-start; }
  /* s5 合并区块：标注更好的潜在结果 + 该决策评分 */
  .bs-block { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; background: #fff; }
  .bs-cap { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .bs-sec { border-top: 1px dashed var(--border); margin-top: 14px; padding-top: 14px; }
  .dt-input-row textarea { flex: 1; min-width: 0; width: auto; }
  .prob-input { flex-shrink: 0; width: 62px !important; padding: 5px 6px !important; font-size: 12px !important;
                text-align: center; min-height: 0 !important; }
  .eval-sel { flex-shrink: 0; appearance: none; -webkit-appearance: none; border: 1px dashed var(--border);
              border-radius: 999px; font-size: 11.5px; font-weight: 600; padding: 3px 10px;
              color: var(--text-muted); background: #fff; cursor: pointer; margin-top: 2px; max-width: 100px; }
  .eval-sel:hover { border-color: var(--accent); }
  .eval-sel.eval-good { border-style: solid; background: var(--success-soft); border-color: var(--success); color: var(--success); }
  .eval-sel.eval-bad { border-style: solid; background: #fbeaea; border-color: var(--danger); color: var(--danger); }
  .eval-sel.eval-neutral { border-style: solid; background: #efedea; border-color: #d4d1cb; color: var(--text-secondary); }
  .eval-sel:disabled { cursor: default; }
  .dt-text { font-size: 12.5px; color: var(--text-secondary); }
  .dt-text div { margin-bottom: 6px; }
  .pair-rows { display: flex; flex-direction: column; gap: 14px; }
  .pair-row { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) 30px; gap: 8px; align-items: start;
              border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fcfbfa; }
  .pair-cap { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
  .pair-arrow { display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 18px; padding-top: 18px; }
  .kt-syncnote { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
  .nav-note { font-size: 12px; color: var(--text-muted); }

  /* ---------- 个人基准库 ---------- */
  .base-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 24px 28px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .base-section h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .base-section .base-src { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

  /* ---------- 报告 ---------- */
  .report-head { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 padding: 22px 26px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .report-head h1 { font-size: 21px; margin-bottom: 6px; }
  .report-head .meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }
  .verdict-banner { display: inline-block; padding: 8px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; }
  .vb-success { background: var(--success-soft); color: var(--success); }
  .vb-warning { background: var(--warning-soft); color: var(--warning); }
  .vb-accent { background: var(--accent-soft); color: var(--accent); }
  .vb-neutral { background: #efedea; color: var(--text-secondary); }
  .quadrant-banner { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .qb-deserved { background: var(--success-soft); color: var(--success); }
  .qb-goodluck { background: var(--warning-soft); color: var(--warning); }
  .qb-badluck { background: var(--accent-soft); color: var(--accent); }
  .qb-fault { background: #fbeaea; color: var(--danger); }
  .lesson-banner { margin-top: 14px; background: #fffbeb; border: 1px solid #f2e3b3; border-radius: var(--radius-sm);
                   padding: 12px 16px; font-size: 14px; }
  .lesson-banner .lb-label { font-size: 11px; font-weight: 700; color: #a07d1c; display: block; margin-bottom: 3px; }
  .report-phase { margin: 18px 0 10px; font-size: 15px; font-weight: 700;
                  display: flex; align-items: center; gap: 8px; break-after: avoid; }
  .report-phase .pdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  /* 全屏回顾：一步一栏、左右成对（左 1 右 2、左 3 右 4…），阶段标题横跨两栏。
     同一排的两张卡片等高，较短的那张用下方留白补齐，整页看起来才齐整；窄屏与打印仍是单列 */
  .report-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .report-flow > .report-phase { grid-column: 1 / -1; }
  .report-flow > .report-step { break-inside: avoid; }
  @media (max-width: 1364px) { .report-flow { grid-template-columns: 1fr; } }
  /* 报告里每一步沿用向导的字段（locked 只读），只把留白收紧，便于快速回看 */
  .report-step { margin-bottom: 0; }        /* 间距交给 .report-flow 的 grid gap */
  .report-step .step-head { padding: 14px 20px 12px; }
  .report-step .step-head h2 { font-size: 17px; }
  .report-step .step-head .tag { margin-bottom: 6px; }
  /* 拆成逐决策卡片时，标题后面挂一个决策编号，两张并排也能一眼分清是哪一条 */
  .dec-chip { display: inline-block; margin-left: 8px; vertical-align: 2px; font-size: 11.5px; font-weight: 600;
              color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
  .report-step .step-body { padding: 14px 20px 16px; }
  .report-step .field { margin-bottom: 14px; }
  .report-step .half-row { gap: 16px; margin-bottom: 14px; }
  .report-step .meta-note { margin-bottom: 10px; padding: 7px 10px; }
  .report-step .sub-title { font-size: 13px; margin-bottom: 8px; }
  .report-step .list-row { padding: 8px 10px; }
  .report-step .as-row { padding: 10px 12px; margin-bottom: 8px; }
  .report-step .as-notes { margin-top: 8px; padding-top: 8px; }
  .report-step .bs-block { padding: 12px 14px; }
  .report-step .bs-sec { margin-top: 10px; padding-top: 10px; }
  .report-step .dec-bar { display: none; }          /* 报告里逐决策全展开，不需要切换 pill */
  /* 增删按钮只读态用不上，隐掉更干净也省空间 */
  .report-step .list-add, .report-step .row-remove { display: none; }
  /* 回顾时不要“磨砂”式的淡化：字段按正常对比度直接呈现内容 */
  .report-step .locked { opacity: 1; }
  .report-step .locked input, .report-step .locked textarea {
    background: #fcfbfa; border-color: var(--border); color: var(--text); box-shadow: none !important;
  }
  /* 过程提示文字（步骤说明、填写提示、“已带入·只读”）在回顾里是噪音，直接去掉 */
  .report-step .meta-note, .report-step .field-hint, .report-step .kt-cap,
  .report-step .kt-syncnote, .report-step .list-empty-hint { display: none; }
  .report-step .qcell { min-height: 96px; }
  .report-step .kt-col { padding: 8px 10px; }
  .report-step .radio-option { padding: 8px 12px; }
  .report-step .score-btn { width: 34px; height: 34px; font-size: 14px; }
  .report-step .field-hint { margin-top: 3px; }
  .report-step .review-body { padding: 12px 14px 14px; }
  .rv-item { margin-bottom: 12px; }
  .rv-sub { font-size: 13px; font-weight: 700; color: var(--text); border-left: 3px solid var(--accent);
            padding-left: 8px; margin: 16px 0 10px; }
  .rv-item:last-child { margin-bottom: 0; }
  .rv-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .rv-value { font-size: 13.5px; white-space: pre-wrap; }
  .rv-value.empty { color: var(--text-muted); font-style: italic; }
  .rv-list { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
  .rv-list li { margin-bottom: 3px; }
  .rv-as { font-size: 13.5px; margin-bottom: 6px; }
  .rv-as-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.6; }
  .rv-as b { font-weight: 600; }
  .rv-yn { font-size: 13.5px; margin-bottom: 6px; }
  .rv-yn b { font-weight: 600; }
  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

  /* 向导页左右两栏只在窗口够宽时才并排：两栏时主内容只有一半宽度，
     半屏（约 960～1280）会把决策树里的「潜在结果」输入框压成一条，文字竖着往下堆；
     宽度不够就把「回顾 / 基准」移到主内容下方，主内容占满整宽（与全屏时基本一致）。 */
  @media (max-width: 1364px) {
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 920px) {
    .ktflow { grid-template-columns: 1fr; }
    .kt-arrow { transform: rotate(90deg); height: 18px; }
    .flow-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .container { padding: 20px 14px 60px; }
    .hero, .report-list, .step-head, .step-body, .report-head, .report-section, .base-section { padding-left: 18px; padding-right: 18px; }
    .score-btn { width: 36px; height: 36px; }
    .score-endlabel { width: 56px; }
    .vt-grid { grid-template-columns: 1fr; }
    .tri-sub { flex-direction: column; gap: 6px; }
    .dtflow { grid-template-columns: 1fr; }
    .half-row { flex-direction: column; gap: 0; }
    .half-row .field.half { margin-bottom: 26px; }
    .concept-grid { grid-template-columns: 1fr; }
    .radio-group.inline { flex-direction: column; gap: 8px; }
    .as-notes { grid-template-columns: 1fr; gap: 10px; }
    .pair-row { grid-template-columns: 1fr; }
    .pair-arrow { transform: rotate(90deg); padding: 0; justify-content: flex-start; }
    .flow-grid { grid-template-columns: 1fr; }
  }
  @media print {
    body { background: #fff; }
    .actions-row, .no-print { display: none !important; }
    .report-head, .report-step, .base-section { box-shadow: none; break-inside: avoid; }
    .report-flow { grid-template-columns: 1fr; }
  }
</style>

<body>
<div class="container" id="app"></div>

<script>
"use strict";

/* =====================================================================
 * 数据常量（移植自四个源工具）
 * ===================================================================== */

/* 幸运箱四象限（luck-box）
 * 坐标约定：X 轴 = 结果好坏（左 好 → 右 坏）；Y 轴 = 决策质量（上 好 → 下 坏） */
const QUADS = {
  badluck: {
    name: "坏运气", num: "Ⅰ",
    def: "你做出的高质量决策，产生了坏结果。",
    ex: "绿灯亮起，你正常起步行驶，却因为其他车辆突然汇入，发生了交通意外。这是一个坏结果，但不代表遵守交通规则是糟糕的决策。",
    axis: "好决策 × 坏结果", cls: "qb-badluck", cellCls: "cell-badluck",
    exHint: "生活一塌糊涂，但你做的决策很好"
  },
  deserved: {
    name: "应得的奖励", num: "Ⅱ",
    def: "你做出的高质量决策，产生了好结果。",
    ex: "你遵照绿灯指示安全通过了十字路口。",
    axis: "好决策 × 好结果", cls: "qb-deserved", cellCls: "cell-deserved",
    exHint: "生活万事顺利，且你所做的决策也很好"
  },
  goodluck: {
    name: "好运气", num: "Ⅲ",
    def: "你做出的低质量决策，产生了好结果。",
    ex: "你等绿灯时沉浸在手机里没注意到绿灯变亮，起步晚了，却恰巧避开了一辆闯红灯冲进路口的汽车，逃过一场事故。这并不代表一边开车一边刷手机是个好决策——你只是运气好。",
    axis: "坏决策 × 好结果", cls: "qb-goodluck", cellCls: "cell-goodluck",
    exHint: "生活万事顺利，但你做的决策很糟糕"
  },
  fault: {
    name: "咎由自取", num: "Ⅳ",
    def: "你做出的低质量决策，产生了坏结果。",
    ex: "你赶时间闯了红灯，结果导致车祸。",
    axis: "坏决策 × 坏结果", cls: "qb-fault", cellCls: "cell-fault",
    exHint: "生活一塌糊涂，且你做的决策也很糟糕"
  }
};
/* 象限图布局顺序：左上 Ⅱ → 右上 Ⅰ → 左下 Ⅲ → 右下 Ⅳ */
const CHART_ORDER = ["deserved", "badluck", "goodluck", "fault"];
/* 结果相同的另一个象限（最终象限二选一） */
const QUAD_COUNTERPART = { deserved: "goodluck", goodluck: "deserved", badluck: "fault", fault: "badluck" };

          hint: "判定口径：只使用决策时刻掌握的信息与认知。" });
        fs7.push({ type: "note", label: "结果判定", text: "结果回顾：" + ((p.r || "").trim() ? p.r : "（第 1 步未填写对应结果）") });
        fs7.push({ key: "predict_" + i, label: "这个结果在当时是合理可预测的吗？（早就知道）", type: "radio", half: true,
          hint: "如果结果在当时基本不可预测，“我早就知道”只是事后错觉。",
          options: [
            ["predictable", "基本可预测", "当时的信息足以合理预见这个结果"],
            ["partial", "部分可预测", "方向可预料，但程度或时机难以预见"],
            ["unlikely", "基本不可预测", "当时几乎无法合理预见这个结果"]
          ] });
        fs7.push({ key: "should_known_" + i, label: "“我本该知道”的判断现在还成立吗？", type: "radio", half: true,
          hint: "只有当时确有合理可知的信号，方可支撑“本该知道”这个判断。",
          options: [
            ["yes", "成立", "确实存在当时合理可知却被忽略的信号"],
            ["partial", "部分成立", "有些环节本可想到，有些确实无法预见"],
            ["no", "不成立", "这是典型的事后诸葛亮——当时不可能知道"]
          ] });
        fs7.push({ key: "kt_feel_" + i, label: "回看：结果是否显得“显而易见”？事后信息有没有混进你对“当时所知”的记忆里？（可按需添加多条）", type: "list",
          itemPlaceholder: "写一条混入记忆的事后信息或感受", emptyHint: "点击下方按钮按需添加" });
      });
      return fs7;
    }
    if (stepId === "s8") {
      if (!decPairs(v).length) return [
        { type: "note", label: "还没有“决策 → 结果”", text: "请先在第 1 步填写决策与实际结果，这里会对每个决策分别做内外视角对照。" }
      ];
      const fs8 = [];
      decList(v, onlyIdx).forEach(x => {
        fs8.push({ type: "subtitle", label: "决策 " + (x.i + 1) + "：" + (x.p.d || "（未填）"), rv: true });
        fs8.push({ type: "viewtrack_multi", key: "vt_" + x.i });
      });
      return fs8;
    }
    if (stepId === "s9") {
      if (!decPairs(v).length) return [
        { type: "note", label: "还没有“决策 → 结果”", text: "请先在第 1 步填写决策与实际结果，这里会按每组观点追踪分别做视角校准。" }
      ];
      const fs9 = [];
      decList(v, onlyIdx).forEach(x => {

        fs9.push({ type: "calgroup", key: "cal_" + x.i, index: x.i });
      });
      return fs9;
    }

    /* ----- 阶段四 · 幸运箱·再判断与总结（s10–s12） ----- */
    if (stepId === "s10") return [
      { key: "final_quadrant", label: "最终象限判断：结果不会改变，可能变化的只是你如何看待自己的决策质量——重新评估后，你会把它归入哪个象限？",
        type: "quadpair",
        hint: "这里只出现两个选项：你的原选择，和结局相同的另一个象限（例如结果坏的，就在“决策质量好/坏”之间重新判断）。" },
      { key: "final_note", label: "如果调整了判断，说明你重新评估了什么；如果维持，也写下支持你的理由。", type: "textarea" }
    ];
    if (stepId === "s11") {
      if (!decPairs(v).length) return [
        { type: "note", label: "还没有“决策 → 结果”", text: "请先在第 1 步填写决策与实际结果，这里会对每个决策分别做改进自查与教训提炼。" }
      ];
      const fs11 = [];
      if (!v.result_eval) fs11.push({ type: "note", label: "按结果方向提炼教训", text: "请回到第 1 步为整体结局选择「好结果 / 差结果」，每个决策的教训题会按方向生成。" });
      decList(v, onlyIdx).forEach(x => {
        const p = x.p, i = x.i;
        fs11.push({ type: "subtitle", label: "决策 " + (i + 1) + "：" + (p.d || "（未填）"), rv: true });
        fs11.push({ key: "improve_" + i, label: "改进空间自查（回答“是”后，请在问题下方写出原因和改进动作）", type: "yesno", items: IMPROVE_QS,
          hint: "就算你做出了一个好决策，也不意味着它就是最佳决策。不要认为事情成功了就没有教训可学。" });
        fs11.push({ key: "keep_" + i, label: "哪些做法值得在同类决策中固定下来？", type: "textarea",
          placeholder: "例：对关键不确定因素先做小成本实地体验。",
          showIf: (vv) => vv.result_eval === "good" });
        fs11.push({ key: "improve_good_" + i, label: "好结果也有改进空间：哪里还能做得更好？", type: "textarea",
          placeholder: "例：当时可以多比较一个选项。",
          showIf: (vv) => vv.result_eval === "good" });
        fs11.push({ key: "repeat_worth_" + i, label: "剥离运气之后，这个决策值得重复吗？", type: "textarea",
          placeholder: "例：值得——同样的信息条件下，任何合理的人都会这么做。",
          showIf: (vv) => vv.result_eval === "bad" });
        fs11.push({ key: "hedge_" + i, label: "同类的坏运气再来一次，可以提前做什么准备？", type: "textarea",
          placeholder: "例：先租房一年再决定长住。",
          showIf: (vv) => vv.result_eval === "bad" });
      });
      return fs11;
    }
    if (stepId === "s12") return [
      { key: "conclusion", label: "一句话结论：把这次复盘最想带走的东西写成一句话", type: "textarea",
        placeholder: "例：结果糟不代表决策错——先分清运气和能力，再决定要不要重复这个决策。" }
    ];
    return [];
  }
};

function decPairs(v) {

/* 逐决策分支通用：onlyIdx == null 输出全部决策，否则只输出该下标（key 下标与原 pairs 位置一致） */
function decList(v, onlyIdx) {

/* 旧版把「可知信号 / 事后才显得必然」做成整个决策共用的两条清单，
   现在改为每条判定下方就地追问：把旧内容挪到该决策下第一条会显示它的条目，避免填过的内容看不见 */
function migrateDraftNotes(v) {
  let moved = false;
  Object.keys(v).forEach(k => {
    const m = /^should_note_(known|hind)_(\d+)$/.exec(k);
    if (!m) return;
    const which = m[1], di = m[2];
    const items = (Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim());
    if (!items.length) { delete v[k]; return; }
    const ans = v["assess_" + di] || {};
    const shows = ri => { const a = ans["i" + ri]; return which === "known" ? (a === "yes" || a === "part") : (a === "part" || a === "no"); };
    const rows = (Array.isArray(v["learned_after_" + di]) ? v["learned_after_" + di] : []).filter(x => (x.t || "").trim());
    let target = null;
    for (let ri = 0; ri < rows.length; ri++) { if (shows(ri)) { target = ri; break; } }
    if (target == null) return;
    const key = (which === "known" ? "known_signals_" : "hind_signals_") + di + "_" + target;
    v[key] = (Array.isArray(v[key]) ? v[key] : []).concat(items);
    delete v[k];
    moved = true;
  });
  return moved;
}

/* 草稿迁移：旧扁平校准字段（same_way_i / deviate_i / calibrated_i）→ cal_i[0]（对应第一组观点追踪） */
function migrateDraftCal(v) {
  let moved = false;
  Object.keys(v).forEach(k => {
    const m = /^(same_way|deviate|calibrated)_(\d+)$/.exec(k);
    if (!m) return;
    const fieldMap = { same_way: "same", deviate: "deviate", calibrated: "cal" };
    const di = m[2], ck = fieldMap[m[1]];
    if (!Array.isArray(v["cal_" + di])) v["cal_" + di] = [];
    if (!v["cal_" + di][0]) v["cal_" + di][0] = {};
    if ((v[k] || "").trim() && !v["cal_" + di][0][ck]) v["cal_" + di][0][ck] = v[k];
    delete v[k];
    moved = true;
  });
  return moved;
}

/* 草稿迁移：优化决策步的旧全局字段（improve/keep/improve_good/repeat_worth/hedge）→ 决策 1（下标 0） */
function migrateDraftS11(v) {
  let moved = false;
  ["improve", "keep", "improve_good", "repeat_worth", "hedge"].forEach(k => {
    if (!(k in v)) return;
    const target = k + "_0";
    if (v[target] == null) v[target] = v[k];
    delete v[k];
    moved = true;
  });
  return moved;
}

/* 自动高度是照“测量当时的宽度”算行数的：窗口缩放、全屏/半屏切换会改变输入框宽度，
 * 行数跟着变，旧高度就会多留空白或把文字裁掉，所以宽度一变就重新量一次。 */
const growWidth = new WeakMap();
const growPending = new WeakSet();
let growObserver = null;

function growTextareas(root) {
  const list = root.querySelectorAll("textarea");
  list.forEach(growEl);
  if (typeof ResizeObserver === "undefined") return;
  if (!growObserver) growObserver = new ResizeObserver(onGrowResize);
  /* 每次重绘都会换掉这批 textarea，先断开，免得观察器一直持有旧节点 */
  growObserver.disconnect();
  list.forEach(el => growObserver.observe(el));
}
function growEl(el) {
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
  growWidth.set(el, el.getBoundingClientRect().width);
}
function onGrowResize(entries) {
  entries.forEach(entry => {
    const el = entry.target;
    const w = el.getBoundingClientRect().width;
    if (w <= 0 || Math.abs((growWidth.get(el) || 0) - w) <= 0.5) return;
    /* 推迟到下一帧再改高度：在观察回调里改了尺寸会触发 ResizeObserver loop 告警 */
    if (growPending.has(el)) return;
    growPending.add(el);
    requestAnimationFrame(() => {
      growPending.delete(el);
      if (el.isConnected) growEl(el);
    });
  });
}
if (typeof ResizeObserver === "undefined") {
  /* 老浏览器兜底：没有 ResizeObserver 时至少跟随窗口尺寸变化 */
  window.addEventListener("resize", () => growTextareas(app));
}

    taField("pv", "base_other", "1. 举例说明：你的朋友 / 家人 / 同事曾经受困于内视角的经历", "例：同事认定“领导对我有意见”，只觉得是自己处境特殊，从没看过同类岗位的普遍情况。") +
    taField("pv", "base_told", "2. 你跟他们说过吗？为什么？", "例：说过 / 没说——当时觉得指出他的盲点会伤感情……") +
    taField("pv", "base_self", "3. 举例说明：你觉得自己曾经受困于内视角的经历", "例：我以为创业失败只是因为运气差，没去查同类项目的真实存活率。") +
    taField("pv", "base_impact", "4. 受困于内视角，在哪些方面对你的决策产生了负面影响？", "例：高估自己的能力圈、低估普遍失败率、忽视与自己立场相反的证据……") +
    taField("pv", "base_phrase", "5. 记录一下：受困于内视角时，通常会怎么说、怎么想？", "例：“我的情况不一样”“别人不懂我的处境”“这次肯定没问题”……") +
    '<div class="field"><label class="field-label">6. 基准数练习：一件事，你在没有调查的情况下判断的概率，以及实际调查后得知的基准概率</label>' + triHtml + '</div>' +
  '</div>';

  /* ② 四象限个人例子（luck-box）：矩阵坐标样式，格内编辑即存 */
  const sec2 = '<div class="base-section">' +
    '<h2>② 四象限个人例子</h2>' +
    '<div class="base-src">来自「幸运箱」四象限（《对赌（实践版）》第一章）——在每个象限格内写下你自己的例子，向导右侧「基准」页签会显示它们，帮助你判断。</div>' +
    quadMatrixHTML("learn") +
  '</div>';

  /* ③ “早就知道 / 本该知道”例子（knowledge-tracker） */
  const cards = Object.keys(CONCEPTS).map(k => {
    const c = CONCEPTS[k];
    return '<div class="concept-card ' + c.cls + '">' +
      '<h4>' + esc(c.name) + '</h4>' +
      '<div class="cc-def">' + esc(c.def) + '</div>' +
      '<div class="cc-ex"><b>典型表现：</b>' + esc(c.cues) + '</div>' +
    '</div>';
  }).join("");
  const sec3 = '<div class="base-section">' +
    '<h2>③ 后视偏差自述例子</h2>' +
    '<div class="base-src">来自「知识追踪器」（《对赌（实践版）》第二章）——写下你自己说过的例子，帮助识别自己的归因习惯。</div>' +
    '<div class="concept-grid">' + cards + '</div>' +
    '<div class="field"><label class="field-label">“我早就知道 / 我早说过”的一个例子</label>' +
    '<textarea data-bk="kt.knew" rows="2" placeholder="例：股价跌了——“我早就知道该早点卖”">' + esc(kt.knew || "") + '</textarea></div>' +
    '<div class="field"><label class="field-label">“我本该知道”的一个例子</label>' +
    '<textarea data-bk="kt.should" rows="2" placeholder="例：项目延期了——“我本该提前估到风险”">' + esc(kt.should || "") + '</textarea></div>' +
  '</div>';

  app.innerHTML =
    '<div class="narrow">' +
    '<div class="hero">' +
      '<div class="kicker">长期保存 · 编辑即存</div>' +
      '<h1>个人基准库</h1>' +
      '<p>这里集中维护三个工具中“只需认真填写一次”的长期内容，复盘向导会在相应步骤自动引用它们。所有修改即时保存。</p>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;">' +
        '<button class="btn secondary" id="btn-bback">← 返回' + (baseFrom === "wizard" ? "复盘向导" : "首页") + '</button>' +
      '</div>' +
    '</div>' +
    sec1 + sec2 + sec3 +
    '</div>';

  app.querySelector("#btn-bback").onclick = () => { view = baseFrom; goRender(); };
  app.querySelectorAll("textarea[data-bk], input[data-bk]").forEach(el => {
    el.addEventListener("input", () => {
      const parts = el.dataset.bk.split(".");
      if (el.dataset.ri != null) {
        if (!Array.isArray(baseline[parts[0]][parts[1]])) baseline[parts[0]][parts[1]] = [];
        baseline[parts[0]][parts[1]][Number(el.dataset.ri)][el.dataset.rk] = el.value;
      } else {
        baseline[parts[0]][parts[1]] = el.value;
      }
      saveBaseline();
      if (el.tagName === "TEXTAREA") growEl(el);
    });
  });
  app.querySelectorAll("[data-badd]").forEach(el => {
    el.onclick = () => {
      if (!Array.isArray(baseline.pv.base_baserate)) baseline.pv.base_baserate = [];
      baseline.pv.base_baserate.push({});
      saveBaseline(); render();
    };
  });
  app.querySelectorAll("[data-brm]").forEach(el => {
    el.onclick = () => {
      baseline.pv.base_baserate.splice(Number(el.dataset.brm), 1);
      saveBaseline(); render();
    };
  });
}

/* ---------- 右栏「基准」页签：个人基准库只读摘要（子页签按工具出场顺序） ---------- */
const BASE_SUBTABS = [
  { id: "lb", name: "幸运箱" },
  { id: "kt", name: "知识追踪" },
  { id: "pv", name: "内外视角" }
];
function baselineSummaryCard() {
  /* 每次渲染都从 localStorage 实时读取，确保与基准库视图的编辑同步 */
  const bl = loadBaseline();
  const pv = bl.pv || {}, kt = bl.kt || {};
  const emptyT = '<div class="rv-value empty">（未填写）</div>';
  const txt = s => (s || "").trim() ? '<div class="rv-value">' + esc(s) + '</div>' : emptyT;

  const subTabs = '<div class="aux-subtabs">' + BASE_SUBTABS.map(t =>
    '<span class="step-chip' + (t.id === baseSubTab ? " active" : "") + '" data-basesub="' + t.id + '">' + t.name + '</span>'
  ).join("") + '</div>';

  let body = "";
  if (baseSubTab === "lb") {
    /* 四象限只读矩阵（实时读 localStorage） */
    body = quadMatrixHTML("readonly");
  } else if (baseSubTab === "kt") {
    body =
      '<div class="rv-item"><div class="rv-label">“我早就知道 / 我早说过”的一个例子</div>' + txt(kt.knew) + '</div>' +
      '<div class="rv-item"><div class="rv-label">“我本该知道”的一个例子</div>' + txt(kt.should) + '</div>';
  } else {
    const qa = [
      ["1. 朋友 / 家人 / 同事曾经受困于内视角的经历", pv.base_other],
      ["2. 你跟他们说过吗？为什么？", pv.base_told],
      ["3. 你自己曾经受困于内视角的经历", pv.base_self],
      ["4. 受困于内视角对决策的负面影响", pv.base_impact],
      ["5. 受困于内视角时通常怎么说、怎么想", pv.base_phrase]
    ];
    const brRows = (Array.isArray(pv.base_baserate) ? pv.base_baserate : []).filter(r => (r.a || "").trim() || (r.b || "").trim() || (r.c || "").trim());
    const brHtml = brRows.length
      ? brRows.map(r => '<div class="rv-as">' + esc(r.a || "（未填事情）") + '：事前判断 <b>' + esc(r.b || "—") + '</b> → 基准概率 <b>' + esc(r.c || "—") + '</b></div>').join("")
      : emptyT;
    body = qa.map(q2 => '<div class="rv-item"><div class="rv-label">' + esc(q2[0]) + '</div>' + txt(q2[1]) + '</div>').join("") +
      '<div class="rv-item"><div class="rv-label">6. 基准数练习（事情：事前判断 → 基准概率）</div>' + brHtml + '</div>';
  }

  return '<div class="review-card">' +
    '<div class="review-head"><h3>个人基准库 · 只读摘要</h3>' +
      '<button type="button" class="btn-edit" id="btn-auxbase">去更新</button></div>' +
    '<div class="review-body">' + subTabs + body +
      '<div class="field-hint" style="margin-top:10px;">在「去更新」中维护，内容自动同步到复盘流程。</div>' +
    '</div>' +
  '</div>';
}

/* ---------- 向导 ---------- */
function renderWizard() {
  const curPhase = STEPS[cur].phase;
  const phaseChips = PHASES.map((ph, pi) => {
    const firstIdx = STEPS.findIndex(s => s.phase === pi);
    const allDone = STEPS.every((s, i) => s.phase !== pi || i < cur);
    const cls = pi === curPhase ? "active" : (allDone ? "done" : "");
    const style = pi === curPhase ? ' style="border-color:' + ph.color + ';background:' + ph.color + '14;"' : "";
    return '<span class="phase-chip ' + cls + '" data-goto="' + firstIdx + '"' + style + '>' +
      '<span class="pdot" style="background:' + ph.color + ';"></span>' + esc(ph.name) + '</span>';
  }).join("");

  const stepChips = STEPS.map((s, i) => ({ s: s, i: i })).filter(x => x.s.phase === curPhase).map((x, xi, arr) => {
    const i = x.i;
    const cls = i === cur ? "active" : (i < cur ? "done" : "");
    const numTxt = i < cur ? "✓" : String(i + 1);
    let chip = '<span class="step-chip ' + cls + '" data-goto="' + i + '">' +
      '<span class="num">' + numTxt + '</span>' + esc(x.s.title) + '</span>';
    if (xi < arr.length - 1) chip += '<span class="step-sep">›</span>';
    return chip;
  }).join("");

  const step = STEPS[cur];
  const meta = stepMetaText(step.id);
  const metaHtml = meta ? '<div class="meta-note">' + esc(meta) + '</div>' : "";
  /* 决策切换器：逐决策步骤且有效决策多于 1 个时显示；decIdx 越界时收敛 */
  const isDecStep = DEC_STEP_IDS.indexOf(step.id) >= 0;
  const dps = decPairs(values);
  if (isDecStep && dps.length > 0 && decIdx > dps.length - 1) decIdx = dps.length - 1;
  /* 逐决策步骤：先在本步内把每个决策依次填完，再进下一步（按钮文案与事件一致） */
  const moreDec = isDecStep && decIdx < dps.length - 1;

  const isLast = cur === STEPS.length - 1;
  const titleOk = !(STEPS[cur].id === TOOL.titleStep && !values[TOOL.titleKey]);
  const navRow =
    '<div class="nav-row">' +
      (cur > 0
        ? '<button class="btn secondary" id="btn-prev">' + (isDecStep && decIdx > 0 ? "← 上一个决策" : "← 上一步") + '</button>'
        : '<button class="btn secondary" id="btn-home">← 返回首页</button>') +
      '<span class="nav-note">' + (titleOk ? "" : esc(TOOL.titleNote)) + '</span>' +
      '<button class="btn" id="btn-next" ' + (titleOk ? "" : "disabled") + '>' +
        (moreDec ? "下一个决策 →" : isLast ? "保存并生成报告" : "下一步 →") + '</button>' +
    '</div>';
  const decBar = (isDecStep && dps.length > 1)
    ? '<div class="dec-bar">' + dps.map((p, di) =>
        '<span class="step-chip dec-pill' + (di === decIdx ? " active" : "") + '" data-dec="' + di + '">' +
          '<span class="dec-pill-txt">决策 ' + (di + 1) + '：' + esc(p.d || "（未填）") + '</span></span>'
      ).join("") + '</div>'
    : "";
  /* 视角校准步：多组观点追踪时左侧也按组切换（与右侧回顾共用 vtViewIdx） */
  const isCalStep = step.id === "s9";
  const calGroups = isCalStep && Array.isArray(values["vt_" + decIdx]) ? values["vt_" + decIdx] : [];
  if (isCalStep && vtViewIdx > calGroups.length - 1) vtViewIdx = 0;
  const calBar = (isCalStep && calGroups.length > 1)
    ? '<div class="dec-bar">' + calGroups.map((g, gi) =>
        '<span class="step-chip dec-pill' + (gi === vtViewIdx ? " active" : "") + '" data-vtview="' + gi + '">' +
          '<span class="dec-pill-txt">' + esc((g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1)) + '</span></span>'
      ).join("") + '</div>'
    : "";
  const leftCard =
    '<div class="step-card">' +
      '<div class="step-head">' +
        '<span class="tag">第 ' + (cur + 1) + ' 步 · ' + esc(step.tag) + '</span>' +
        '<h2>' + esc(step.title) + '</h2>' +
      '</div>' +
      '<div class="step-body">' + decBar + calBar + metaHtml + stepBody(cur, false, isCalStep && calGroups.length ? vtViewIdx : null) + navRow + '</div>' +
    '</div>';

  /* 右侧辅助框：「回顾 / 基准」双页签，从第 1 步起始终显示 */
  const tab = auxTab || (cur === 0 ? "base" : "review");
  const auxTabs =
    '<div class="aux-tabs">' +
      '<button type="button" class="bevel-btn aux-tab' + (tab === "review" ? " active" : "") + '" data-aux="review"><span>回顾</span></button>' +
      '<button type="button" class="bevel-btn aux-tab' + (tab === "base" ? " active" : "") + '" data-aux="base"><span>基准</span></button>' +
    '</div>';
  let auxBody = "";
  if (tab === "review") {
    if (cur === 0) {
      auxBody = '<div class="review-card"><div class="review-body">' +
        '<p class="empty-hint">完成第 1 步后，这里可以翻阅与就地修改已填写的内容。</p>' +
      '</div></div>';
    } else {
      if (reviewIdx == null || reviewIdx < 0 || reviewIdx > cur - 1) reviewIdx = cur - 1;
      const i = reviewIdx;
      const editing = reviewEdit === i;
      const rMeta = stepMetaText(STEPS[i].id);
      /* 回顾栏：逐决策步骤同样渲染决策切换 pill（绑定同一 decIdx，左右天然同步） */
      const rIsDec = DEC_STEP_IDS.indexOf(STEPS[i].id) >= 0;
      const rDecBar = (rIsDec && dps.length > 1)
        ? '<div class="dec-bar sm">' + dps.map((p, di) =>
            '<span class="step-chip dec-pill' + (di === decIdx ? " active" : "") + '" data-dec="' + di + '">' +
              '<span class="dec-pill-txt">决策 ' + (di + 1) + '：' + esc(p.d || "（未填）") + '</span></span>'
          ).join("") + '</div>'
        : "";
      /* 阶段切换键：点一下直接跳到该阶段的回顾页（该阶段还没走到时置灰） */
      const rvPhases = '<div class="rv-phases">' + PHASES.map((ph, pi) => {
        const done = STEPS.map((s2, si) => si).filter(si => STEPS[si].phase === pi && si <= cur - 1);
        return '<button type="button" class="bevel-btn rv-phase' + (STEPS[i].phase === pi ? " active" : "") + '"' +
          (done.length ? ' data-rvphase="' + done[0] + '"' : " disabled") +
          ' style="--pc:' + ph.color + ';--pt:' + ph.soft + ';"' +
          ' title="' + esc(ph.name) + (done.length ? "" : "（还没走到）") + '">' +
          '<span>' + ["一", "二", "三", "四"][pi] + " " + esc(ph.short) + '</span></button>';
      }).join("") + '</div>';
      /* 回顾内容是内外视角（viewtrack_multi）时：按组切换查看 */
      const rIsVt = STEPS[i].id === "s8";
      const vtGroups = rIsVt && Array.isArray(values["vt_" + decIdx]) ? values["vt_" + decIdx] : [];
      if (vtViewIdx > vtGroups.length - 1) vtViewIdx = 0;
      const rVtBar = (rIsVt && vtGroups.length > 1)
        ? '<div class="dec-bar sm">' + vtGroups.map((g, gi) =>
            '<span class="step-chip dec-pill' + (gi === vtViewIdx ? " active" : "") + '" data-vtview="' + gi + '">' +
              '<span class="dec-pill-txt">' + esc((g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1)) + '</span></span>'
          ).join("") + '</div>'
        : "";
      /* 回顾正文：逐决策步骤按「meta → 块标题（决策 N）→ 决策切换 pill →（组 pill）→ 内容」排列，
         pill 紧邻其控制的内容；非逐决策步骤保持原样 */
      const rLocked = !editing;
      const rMetaHtml = rMeta ? '<div class="meta-note">' + esc(rMeta) + '</div>' : "";
      let bodyInner;
      if (rIsDec) {
        const rFs = fieldsFor(STEPS[i].id, values, decIdx);
        let headHtml = "";
        let restFs = rFs;
        if (rFs.length && (rFs[0].type === "subtitle" || rFs[0].type === "note")) {
          headHtml = renderFields([rFs[0]], rLocked);
          restFs = rFs.slice(1);
        }
        bodyInner = rMetaHtml + headHtml + rDecBar + rVtBar +
          renderFields(restFs, rLocked, rIsVt && vtGroups.length ? vtViewIdx : null);
      } else {
        bodyInner = rMetaHtml + stepBody(i, rLocked, null);
      }
      auxBody =
        '<div class="review-card">' +
          '<div class="review-head">' +
            '<div class="rv-nav">' +
              (cur > 1 ? '<button class="rv-arrow" data-rvprev' + (i <= 0 ? " disabled" : "") + '>‹</button>' : "") +
              '<h3>回顾 · 第 ' + (i + 1) + ' 步 ' + esc(STEPS[i].title) + '（' + (i + 1) + '/' + cur + '）</h3>' +
              (cur > 1 ? '<button class="rv-arrow" data-rvnext' + (i >= cur - 1 ? " disabled" : "") + '>›</button>' : "") +
            '</div>' +
            '<button class="btn-edit ' + (editing ? "on" : "") + '" data-review="' + i + '">' + (editing ? "完成" : "编辑") + '</button>' +
          '</div>' +
          rvPhases +
          '<div class="review-body' + (editing ? "" : " locked") + '">' + bodyInner + '</div>' +
        '</div>';
    }
  } else {
    auxBody = baselineSummaryCard();
  }
  const rightCol = '<div class="review-col aux">' + auxTabs + auxBody + '</div>';

  app.innerHTML =
    (editingReportIdx != null && reports[editingReportIdx]
      ? '<div class="edit-banner">' +
          '<span>正在编辑已保存的报告「' + esc(reports[editingReportIdx].values[TOOL.titleKey] || "未命名") + '」——保存后更新这一份，不会新增。</span>' +
          '<button type="button" class="btn secondary" id="btn-abandon">放弃编辑</button>' +
        '</div>'
      : "") +
    '<div class="phase-bar">' + phaseChips + '</div>' +
    '<div class="stepper">' + stepChips + '</div>' +
    '<div class="split">' + leftCard + rightCol + '</div>';

  bindFieldEvents(app);
  app.querySelectorAll("[data-aux]").forEach(el => {
    el.onclick = () => { auxTab = el.dataset.aux; render(); };
  });
  app.querySelectorAll("[data-basesub]").forEach(el => {
    el.onclick = () => { baseSubTab = el.dataset.basesub; render(); };
  });
  const auxbase = app.querySelector("#btn-auxbase");
  if (auxbase) auxbase.onclick = () => { baseFrom = "wizard"; view = "baseline"; goRender(); };
  app.querySelectorAll("[data-dec]").forEach(el => {
    el.onclick = () => { decIdx = Number(el.dataset.dec); vtViewIdx = 0; render(); };
  });
  app.querySelectorAll("[data-goto]").forEach(el => {
    el.onclick = () => { cur = Number(el.dataset.goto); decIdx = 0; reviewEdit = -1; reviewIdx = null; goRender(); };
  });
  app.querySelectorAll("[data-review]").forEach(el => {
    el.onclick = () => { reviewEdit = (reviewEdit === reviewIdx) ? -1 : reviewIdx; render(); };
  });
  app.querySelectorAll("[data-rvprev]").forEach(el => {
    el.onclick = () => { reviewIdx = Math.max(0, reviewIdx - 1); reviewEdit = -1; vtViewIdx = 0; render(); };
  });
  app.querySelectorAll("[data-rvnext]").forEach(el => {
    el.onclick = () => { reviewIdx = Math.min(cur - 1, reviewIdx + 1); reviewEdit = -1; vtViewIdx = 0; render(); };
  });
  app.querySelectorAll("[data-rvphase]").forEach(el => {
    el.onclick = () => { reviewIdx = Number(el.dataset.rvphase); reviewEdit = -1; vtViewIdx = 0; render(); };
  });
  app.querySelectorAll("[data-vtview]").forEach(el => {
    el.onclick = () => { vtViewIdx = Number(el.dataset.vtview); render(); };
  });
  /* 放弃编辑：不写回报告，草稿也清掉（它是从报告复制来的），退回那份报告 */
  const abandon = app.querySelector("#btn-abandon");
  if (abandon) abandon.onclick = () => {
    if (!confirm("放弃这次编辑吗？未保存的改动会丢失，报告保持原样。")) return;
    const rep = editingReportIdx != null ? reports[editingReportIdx] : null;
    editingReportIdx = null;
    localStorage.removeItem(LS_DRAFT);
    values = {};
    reviewEdit = -1; reviewIdx = null; decIdx = 0; auxTab = null;
    if (rep) { viewingReport = rep; view = "report"; } else { view = "home"; viewingReport = null; }
    goRender();
  };
  const prev = app.querySelector("#btn-prev");
  if (prev) prev.onclick = () => {
    /* 逐决策步骤：先退回本步的上一个决策；退出本步时落在上一步的最后一个决策，
       「上一步」成为「下一步」的严格倒序 */
    if (isDecStep && decIdx > 0) { decIdx--; goRender(); return; }
    cur--;
    decIdx = DEC_STEP_IDS.indexOf(STEPS[cur].id) >= 0 ? Math.max(0, decPairs(values).length - 1) : 0;
    reviewEdit = -1; reviewIdx = null; goRender();
  };
  const home = app.querySelector("#btn-home");
  if (home) home.onclick = () => { view = "home"; goRender(); };
  app.querySelector("#btn-next").onclick = () => {
    /* 逐决策步骤：本步还有决策没填就先去下一个决策，全部填完才进下一步 */
    if (moreDec) { decIdx++; goRender(); return; }
    if (isLast) finishReport();
    else { cur++; decIdx = 0; reviewEdit = -1; reviewIdx = null; goRender(); }
  };
}

/* ---------- 步骤主体 ---------- */
function stepBody(i, locked, vtGroup) {
  const id = STEPS[i].id;
  const onlyIdx = (view === "wizard" && DEC_STEP_IDS.indexOf(id) >= 0) ? decIdx : null;
  return renderFields(fieldsFor(id, values, onlyIdx), locked, vtGroup == null ? null : vtGroup);
}

/* ---------- 字段渲染 ---------- */
function renderFields(fields, locked, vtGroup) {
  let html = "";
  let buf = [];
  const flush = () => {
    if (buf.length) { html += '<div class="half-row">' + buf.join("") + '</div>'; buf = []; }
  };
  fields.forEach(f => {
    if (f.showIf && !f.showIf(values)) return;
    if (f.half) { buf.push(renderField(f, locked, vtGroup)); if (buf.length === 2) flush(); return; }
    flush();
    html += renderField(f, locked, vtGroup);
  });
  flush();
  return html;
}

function renderField(f, locked, vtGroup) {
  if (f.showIf && !f.showIf(values)) return "";
  const lk = locked ? " locked" : "";
  const dis = locked ? " disabled" : "";
  const v = values[f.key];
  let body = "";
  if (f.type === "text") {
    body = '<input type="text" data-k="' + f.key + '"' + dis + ' value="' + esc(v || "") + '" placeholder="' + esc(f.placeholder || "") + '">';
  } else if (f.type === "textarea") {
    body = '<textarea data-k="' + f.key + '" rows="3"' + dis + ' placeholder="' + esc(f.placeholder || "") + '">' + esc(v || "") + '</textarea>';
  } else if (f.type === "radio") {
    body = '<div class="radio-group' + (f.inline ? " inline" : "") + lk + '">' + f.options.map(op =>
      '<label class="radio-option ' + (v === op[0] ? "checked" : "") + lk + '">' +
        '<input type="radio" name="' + f.key + '" value="' + op[0] + '" ' + (v === op[0] ? "checked" : "") + dis + '>' +
        '<span>' + esc(op[1]) + (op[2] ? '<span class="opt-desc">' + esc(op[2]) + '</span>' : "") + '</span>' +
      '</label>').join("") + '</div>';
  } else if (f.type === "score") {
    body = '<div class="score-row' + lk + '">' +
      '<span class="score-endlabel">低</span>' +
      [0,1,2,3,4,5].map(n =>
        '<button type="button" class="score-btn ' + (Number(v) === n ? "checked" : "") + '" data-score="' + f.key + '" data-val="' + n + '"' + dis + '>' + n + '</button>'
      ).join("") +
      '<span class="score-endlabel right">高</span>' +

  } else if (f.type === "list") {
    const rows = Array.isArray(v) ? v : [];

          '<div class="list-row">' +
            '<span class="idx">' + (ri + 1) + '.</span>' +
            '<textarea data-lk="' + f.key + '" data-ri="' + ri + '" data-rk="t" rows="1"' + dis + ' placeholder="' + esc(f.itemPlaceholder || "") + '">' + esc(row.t || "") + '</textarea>' +
            '<button type="button" class="row-remove" data-rmrow="' + f.key + '" data-ri="' + ri + '" title="删除本条"' + dis + '>×</button>' +
          '</div>').join("") + '</div>';
    body = rowsHtml +

  } else if (f.type === "chipslist") {

  } else if (f.type === "assess") {

  } else if (f.type === "viewtrack_multi") {

    const gKey = f.key;

        : cards) +
        '<button type="button" class="list-add" data-vtgaddgrp="' + gKey + '"' + dis + '>＋ 添加一组观点追踪</button>';
  } else if (f.type === "calgroup") {

      body = gIdxList.map(gi => {
        const g = groups[gi];

          ta("cal", "3. 校准后更准确的判断", "例：这件事成功的基准概率约 40%，我的条件略好，估计 50% 左右；先小成本验证再加大投入。") +

      '<div class="score-row' + lk + '">' +
        '<span class="score-endlabel">低</span>' +
        [0,1,2,3,4,5].map(nn =>
          '<button type="button" class="score-btn ' + (Number(sv) === nn ? "checked" : "") + '" data-score="' + f.scoreKey + '" data-val="' + nn + '"' + dis + '>' + nn + '</button>'
        ).join("") +

    const rv2 = values[f.repeatKey];
    const repeatSec = '<div class="bs-sec"><div class="bs-cap">③ ' + esc(f.repeatLabel) + '</div>' +
      radioRow(f.repeatKey, [["yes", "会"], ["no", "不会"], ["unsure", "不确定"]], rv2) +
      (rv2 ? '<div style="margin-top:10px;"><label class="field-label">' + esc(f.reasonLabel) + '</label>' +
        '<textarea data-k="' + f.reasonKey + '" rows="2"' + dis + ' placeholder="' + esc(f.reasonPlaceholder || "") + '">' + esc(values[f.reasonKey] || "") + '</textarea></div>' : "") +
    '</div>';
    /* ② 勾选更好的潜在结果 */
    const ans = v || {};
    let n = 0;
    const items = alts.map((row, ri) => {
      if (!(row.t || "").trim()) return "";
      n++;

      const prob = (row.p || "").trim() ? '<span class="prob-badge">概率 ' + esc(row.p) + '</span>' : "";

      : "";

      (n === 0
        ? '<div class="field-hint">先在第 7 步为这棵决策树补充潜在结果，这里会同步列出供勾选。</div>'
        : '<div class="radio-group' + lk + '">' + items + '</div>') +
      (f.betterHint ? '<div class="field-hint">' + esc(f.betterHint) + '</div>' : "") +

      radioRow(f.luckKey, [["luck", "主要靠运气"], ["half", "运气与决策各半"], ["skill", "主要靠决策质量"]], lv) +

  } else if (f.type === "ktflow") {

  return '<div class="field' + lk + halfCls + '">' + (f.label ? '<label class="field-label">' + esc(f.label) + '</label>' : "") + body + hint + '</div>';

/* ---------- 四象限矩阵（pick 点选 / learn 基准库编辑 / readonly 只读摘要 三模式共用） ---------- */
function quadMatrixHTML(mode, opts) {
  opts = opts || {};
  const locked = !!opts.locked;
  /* pick/readonly 实时读 localStorage；learn 用内存中的 baseline（基准库视图编辑即存） */
  const lb = mode === "learn" ? (baseline.lb || {}) : ((loadBaseline().lb || {}));
  const cell = (k) => {
    const q = QUADS[k];
    const head = '<div class="qc-head"><span class="qc-num">第' + q.num + '象限</span>' +
      '<span class="qc-name">' + esc(q.name) + '</span>' +
      '<span class="qc-axis">' + esc(q.axis) + '</span></div>';
    const myex = (lb[k] || "").trim();
    if (mode === "pick") {
      const v = values[opts.fieldKey];
      const checked = v === k || (v == null && opts.fieldKey === "final_quadrant" && values.quadrant === k);
      return '<label class="qcell qcell-pick ' + q.cellCls + (checked ? " checked" : "") + (locked ? " locked" : "") + '">' +
        '<input type="radio" name="' + opts.fieldKey + '" value="' + k + '"' + (checked ? " checked" : "") + (locked ? " disabled" : "") + '>' +
        head +
        '<div class="qc-def">' + esc(q.def) + '</div>' +
        '<div class="qc-ex"><b>例子：</b>' + esc(q.ex) + '</div>' +
        (myex ? '<div class="qc-ex"><b>我的例子：</b>' + esc(myex) + '</div>' : "") +
        '<div class="qc-pickmark">✓ 已选择</div>' +
      '</label>';
    }
    if (mode === "learn") {
      return '<div class="qcell ' + q.cellCls + '">' +
        head +
        '<div class="qc-def">' + esc(q.def) + '</div>' +
        '<div class="qc-ex"><b>书中例子：</b>' + esc(q.ex) + '</div>' +
        '<textarea data-bk="lb.' + k + '" rows="2" placeholder="写一个你自己的例子（' + esc(q.exHint) + '）">' + esc(myex) + '</textarea>' +
      '</div>';
    }
    /* readonly：只读矩阵，格内显示我的例子全文 */
    return '<div class="qcell ' + q.cellCls + '">' +
      head +
      '<div class="qc-ex qc-myex">' + (myex ? esc(myex) : '<span style="font-style:italic;">（未填写）</span>') + '</div>' +
    '</div>';
  };
  // 顺序映射到坐标格：左上 deserved(Ⅱ)、右上 badluck(Ⅰ)、左下 goodluck(Ⅲ)、右下 fault(Ⅳ)
  return '<div class="quad-chart' + (mode === "readonly" ? " sm" : "") + '">' +
    '<div class="q-yaxis"><span class="ylab">好</span><span class="ytitle">决策质量</span><span class="ylab">坏</span></div>' +
    cell(CHART_ORDER[0]) + cell(CHART_ORDER[1]) +
    cell(CHART_ORDER[2]) + cell(CHART_ORDER[3]) +
    '<div class="q-xaxis"><span class="xlab">好</span><span class="xtitle">结果好坏</span><span class="xlab">坏</span></div>' +
  '</div>';
}
function quadChartPick(fieldKey, locked) {
  return quadMatrixHTML("pick", { fieldKey: fieldKey, locked: locked });
}
