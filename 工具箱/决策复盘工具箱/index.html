/* ---------- 保存报告 ---------- */
function finishReport() {
  const clean = JSON.parse(JSON.stringify(values));
  Object.keys(clean).forEach(k => {
    const arr = clean[k];
    if (Array.isArray(arr) && arr.length && arr.every(x => typeof x === "object" && x !== null)) {
      clean[k] = arr.filter(row => Object.values(row).some(val => val != null && val !== ""));
    }
  });
  /* 从「重新编辑」进来的：覆盖原报告（保留 id 与保存日期），否则作为新报告放到最前 */
  const editing = editingReportIdx != null ? reports[editingReportIdx] : null;
  const report = editing
    ? { id: editing.id, date: editing.date, values: clean }
    : { id: Date.now(), date: new Date().toLocaleString("zh-CN"), values: clean };
  if (editing) reports[editingReportIdx] = report;
  else reports.unshift(report);
  editingReportIdx = null;
  persistReports();
  localStorage.removeItem(LS_DRAFT);
  values = {};
  viewingReport = report;
  view = "report";
  goRender();
}

/* ---------- 报告 ---------- */
function rv(label, val) {
  const has = val != null && val !== "" && !(Array.isArray(val) && val.length === 0);
  const body = !has
    ? '<div class="rv-value empty">（未填写）</div>'
    : Array.isArray(val)
      ? '<ul class="rv-list">' + val.map(x => rvItemText(x)).join("") + '</ul>'
      : '<div class="rv-value">' + esc(val) + '</div>';
  return '<div class="rv-item"><div class="rv-label">' + esc(label) + '</div>' + body + '</div>';
}
function rvItemText(x) {
  if (typeof x === "object") {
    const chipMap = f_chipMap || {};
    const chipLabel = x.c && chipMap[x.c] ? "（" + chipMap[x.c] + "）" : "";
    return "<li>" + esc((x.t || "") + chipLabel) + "</li>";
  }
  return "<li>" + esc(x) + "</li>";
}
let f_chipMap = {};

function rvHtml(label, html) {
  const body = (html == null || html === "") ? '<div class="rv-value empty">（未填写）</div>' : html;
  return '<div class="rv-item"><div class="rv-label">' + esc(label) + '</div>' + body + '</div>';
}

function quadText(v, key) {
  const q = v[key];
  return q && QUADS[q] ? QUADS[q].name + "（" + QUADS[q].axis + "）" : "";
}

function renderRV(f, v) {
  if (f.showIf && !f.showIf(v)) return "";
  const val = v[f.key];
  if (f.type === "radio") {
    const opt = (f.options || []).find(o => o[0] === val);
    return rv(f.label, opt ? opt[1] : "");
  }
  if (f.type === "score") {
    return rv(f.label, (val != null && val !== "") ? val + " / 5" : "");
  }
  if (f.type === "list") {
    return rv(f.label, val);
  }
  if (f.type === "chipslist") {
    f_chipMap = {};
    (f.chips || []).forEach(ch => { f_chipMap[ch[0]] = ch[1]; });
    return rv(f.label, val);
  }
  if (f.type === "assess") {
    const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim())), []);
    const ans = val || {};
    const listTxt = key => (Array.isArray(v[key]) ? v[key] : []).filter(x => (x.t || "").trim()).map(x => x.t).join("；");
    const html = rows.map((row, ri) => {
      const a = ans["i" + ri];
      if (!a) return "";
      const opt = (f.options || []).find(o => o[0] === a);
      const sub = [];
      if (a === "yes" || a === "part") { const t = listTxt(f.knownKey + "_" + ri); if (t) sub.push("当时合理可知的信号：" + t); }
      if (a === "part" || a === "no") { const t = listTxt(f.hindKey + "_" + ri); if (t) sub.push("只是事后才显得必然：" + t); }
      return '<div class="rv-as"><b>' + esc(opt ? opt[1] : "") + '</b> — ' + esc(row.t || "") +
        (sub.length ? '<div class="rv-as-sub">' + sub.map(esc).join('<br>') + '</div>' : "") + '</div>';
    }).join("");
    if (html) return rvHtml(f.label, html);
    return "";
  }
  if (f.type === "triplist") {
    const rows = (Array.isArray(val) ? val : []).filter(r => (r.a || "").trim() || (r.b || "").trim() || (r.c || "").trim());
    if (!rows.length) return rv(f.label, null);
    const html = rows.map(r =>
      '<div class="rv-as">' + esc(r.a || "（未填事情）") + '：事前判断 <b>' + esc(r.b || "—") + '</b> → 基准概率 <b>' + esc(r.c || "—") + '</b></div>'
    ).join("");
    return rvHtml(f.label, html);
  }
  if (f.type === "calgroup") {
    const idx = f.index;
    const groups = Array.isArray(v["vt_" + idx]) ? v["vt_" + idx] : [];
    const cals = Array.isArray(val) ? val : [];
    const n = Math.max(groups.length, cals.length);
    let out = "";
    for (let gi = 0; gi < n; gi++) {
      const g = groups[gi] || {};
      const c = cals[gi] || {};
      if (!(c.same || "").trim() && !(c.deviate || "").trim() && !(c.cal || "").trim()) continue;
      const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
      out += '<div class="rv-sub" style="font-size:12.5px;margin:10px 0 6px;">' + esc(title) + '</div>' +
        ((c.same || "").trim() ? rv("完全相同的地方", c.same) : "") +
        ((c.deviate || "").trim() ? rv("偏离分析", c.deviate) : "") +
        ((c.cal || "").trim() ? rv("校准后的判断", c.cal) : "");
    }
    return out;
  }
  if (f.type === "viewtrack_multi") {
    const groups = (Array.isArray(val) ? val : []).filter(g =>
      (g.name || "").trim() || (Array.isArray(g.out) && g.out.some(x => (x.t || "").trim())) || (Array.isArray(g.in) && g.in.some(x => (x.t || "").trim())));
    if (!groups.length) return "";
    const colH = arr => {
      const rows = (Array.isArray(arr) ? arr : []).filter(x => (x.t || "").trim());
      if (!rows.length) return '<div class="rv-value empty">（未填写）</div>';
      return '<ul class="rv-list">' + rows.map(x => "<li>" + esc(x.t) + "</li>").join("") + '</ul>';
    };
    return groups.map((g, gi) => {
      const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
      return '<div class="rv-item"><div class="rv-label">' + esc(title) + '</div>' +
        '<div class="rv-value"><b>外视角</b></div>' + colH(g.out) +
        '<div class="rv-value" style="margin-top:8px;"><b>内视角</b></div>' + colH(g.in) +
      '</div>';
    }).join("");
  }
  if (f.type === "quadpick") {
    return rv(f.label, quadText(v, f.key));
  }
  if (f.type === "quadpair") {
    const fin = val || v.quadrant;
    let txt = quadText({ quadrant: fin }, "quadrant");
    if (v.quadrant && QUADS[v.quadrant]) {
      txt += (val && val !== v.quadrant) ? "（初步判断：" + QUADS[v.quadrant].name + "，已修正）" : "（与初步判断一致）";
    }
    return rv(f.label, txt);
  }
  if (f.type === "yesno") {
    const ans = val || {};
    const ynHtml = f.items.map((qtext, i) => {
      const a = ans["i" + i];
      if (!a) return "";
      let line = '<div class="rv-yn"><b>' + (a === "yes" ? "是" : "否") + '</b> — ' + esc(qtext);
      if (a === "yes" && ans["n" + i]) line += '<br><span style="color:var(--text-secondary);font-size:13px;">└ ' + esc(ans["n" + i]) + '</span>';
      return line + '</div>';
    }).join("");
    let out = ynHtml ? rvHtml(f.label, ynHtml) : "";
    if (f.extraList && v[f.extraList.key]) out += rv(f.extraList.label, v[f.extraList.key]);
    return out;
  }
  if (f.type === "pairs") {
    const rows = (Array.isArray(val) ? val : []).filter(x => (x.d || "").trim() || (x.r || "").trim());
    const html = rows.map(x => "<li>" + esc((x.d || "（未填）") + " → " + (x.r || "（未填）")) + "</li>").join("");
    return rvHtml(f.label, "<ul class='rv-list'>" + html + "</ul>");
  }
  if (f.type === "dtree") {
    const idx = f.index;
    const pair = decPairs(v)[idx] || {};
    const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
    const lines = [];
    const act = v["actual_" + idx] || {};
    if ((pair.r || "").trim()) lines.push("<b>实际发生（已同步）</b> — " + esc(pair.r) + ((act.p || "").trim() ? "（概率 " + esc(act.p) + "）" : "") + (act.c && EVAL_LABELS[act.c] ? "（" + esc(EVAL_LABELS[act.c]) + "）" : ""));
    alts.forEach(a => { if ((a.t || "").trim()) lines.push(esc(a.t) + (a.p ? "（概率 " + esc(a.p) + "）" : "") + (a.c && EVAL_LABELS[a.c] ? "（" + esc(EVAL_LABELS[a.c]) + "）" : "")); });
    return rvHtml("决策树 " + (idx + 1) + "：" + (pair.d || "（未填）"), "<ul class='rv-list'>" + lines.map(l => "<li>" + l + "</li>").join("") + "</ul>");
  }
  if (f.type === "betterpick") {
    const idx = f.index;
    const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
    const ans = val || {};
    const picked = [];
    alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) picked.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
    return rv(f.label, picked);
  }
  if (f.type === "betterscore") {
    const idx = f.index;
    const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
    const ans = val || {};
    const repeatMap = { yes: "会", no: "不会", unsure: "不确定" };
    const luckMap = { luck: "主要靠运气", half: "运气与决策各半", skill: "主要靠决策质量" };
    let out = "";
    /* ① 打分 */
    const sv = v[f.scoreKey];
    out += rv("① 决策质量评分", (sv != null && sv !== "") ? sv + " / 5" : "");
    /* ② 勾选 */
    const picked = [];
    alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) picked.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
    out += rv("② 比实际更好的潜在结果", picked);
    /* ③ 重来一次 */
    const rp = v[f.repeatKey];
    out += rv("③ 重来一次是否同样决策", rp && repeatMap[rp] ? repeatMap[rp] : "");
    if (v[f.reasonKey]) out += rv("③ 原因", v[f.reasonKey]);
    /* ④ 归因 */
    const lk2 = v[f.luckKey];
    out += rv("④ 这个实际结果更多由什么决定", lk2 && luckMap[lk2] ? luckMap[lk2] : "");
    if (v[f.respKey]) out += rv("④ 对自身责任的看法", v[f.respKey]);
    return out;
  }
  if (f.type === "ktflow") {
    const idx = f.index;
    const pair = decPairs(v)[idx] || {};
    const listH = key => {
      const rows = (Array.isArray(v[key]) ? v[key] : []).filter(x => (x.t || "").trim());
      return rows.length
        ? '<ul class="rv-list">' + rows.map(x => "<li>" + esc(x.t) + "</li>").join("") + '</ul>'
        : '<div class="rv-value empty">（未填写）</div>';
    };
    const decH = (pair.d || "").trim()
      ? '<div class="rv-value">' + esc(pair.d) + '</div>'
      : '<div class="rv-value empty">（未填写）</div>';
    const resH = (pair.r || "").trim()
      ? '<div class="rv-value">' + esc(pair.r) + '</div>'
      : '<div class="rv-value empty">（未填写）</div>';
    return rvHtml(f.label || "知识流程",
      '<div class="rv-value"><b>① 做决策前就知道的事</b></div>' + listH("known_before_" + idx) +
      '<div class="rv-value" style="margin-top:8px;"><b>② 决策</b></div>' + decH +
      '<div class="rv-value" style="margin-top:8px;"><b>③ 结果</b></div>' + resH +
      '<div class="rv-value" style="margin-top:8px;"><b>④ 结果出来后才知道的事</b></div>' + listH("learned_after_" + idx));
  }
  if (f.type === "subtitle") return f.rv ? '<div class="rv-sub">' + esc(f.label) + '</div>' : "";
  if (f.type === "note" || f.type === "dtex") return "";
  return rv(f.label, val);
}

function renderReport() {
  const r = viewingReport;
  if (!r) { view = "home"; goRender(); return; }
  const v = r.values;
  const vd = verdictOf(v);

  /* 报告复用向导那套字段（locked 只读态）逐步骤重绘：
     版式与复盘过程一致，回看更直观，要改哪一条也能照着原位回去找 */
  let sections = "";
  const draftValues = values;
  try {
    values = v;
    PHASES.forEach((ph, pi) => {
      const stepsHtml = STEPS.map((st, si) => ({ st: st, si: si })).filter(x => x.st.phase === pi).map(x => {
        const keep = f => f.type !== "note" && f.type !== "dtex";
        /* 逐决策的步骤按决策拆成多张卡片：一张卡只呈现一个决策，长短不会互相拖累 */
        const isDec = DEC_STEP_IDS.indexOf(x.st.id) >= 0;
        const nDec = isDec ? decPairs(v).length : 0;
        const cards = nDec > 1
          ? decPairs(v).map((p, di) => ({ di: di, fs: fieldsFor(x.st.id, v, di).filter(keep) }))
          : [{ di: null, fs: fieldsFor(x.st.id, v).filter(keep) }];
        return cards.map(c =>
          '<div class="step-card report-step">' +
            '<div class="step-head">' +
              '<span class="tag">第 ' + (x.si + 1) + ' 步 · ' + esc(x.st.tag) + '</span>' +
              '<h2>' + esc(x.st.title) +
                (c.di == null ? "" : '<span class="dec-chip">决策 ' + (c.di + 1) + ' / ' + nDec + '</span>') +
              '</h2>' +
            '</div>' +
            '<div class="step-body">' + renderFields(c.fs, true) + '</div>' +
          '</div>').join("");
      }).join("");
      sections += '<div class="report-phase"><span class="pdot" style="background:' + ph.color + ';"></span>' + esc(ph.name) + '</div>' + stepsHtml;
    });
  } finally { values = draftValues; }

  app.innerHTML =
    '<div class="report-head">' +
      '<div class="kicker" style="font-size:12px;font-weight:600;color:var(--accent);letter-spacing:0.06em;margin-bottom:8px;">' + esc(TOOL.reportKicker) + '</div>' +
      '<h1>' + esc(v[TOOL.titleKey] || "未命名") + '</h1>' +
      '<div class="meta">保存于 ' + esc(r.date) + '</div>' +
      (vd.t ? '<span class="verdict-banner ' + vd.cls + '">' + esc(vd.t) + '</span>' : "") +
      (v[TOOL.conclusionKey] ? '<div class="lesson-banner"><span class="lb-label">一句话结论</span>' + esc(v[TOOL.conclusionKey]) + '</div>' : "") +
      '<div class="actions-row">' +
        '<button class="btn secondary" id="btn-copy">复制为文字</button>' +
        '<button class="btn secondary" id="btn-print">打印 / 导出 PDF</button>' +
        '<button class="btn secondary" id="btn-reedit">重新编辑</button>' +
        '<button class="btn secondary" id="btn-back">← 返回首页</button>' +
        '<button class="btn danger-ghost" id="btn-del" style="margin-left:auto;">删除这份复盘</button>' +
      '</div>' +
    '</div>' + '<div class="report-flow">' + sections + '</div>' +
    '<div class="actions-row no-print"><button class="btn secondary" id="btn-back2">← 返回首页</button></div>';

  app.querySelector("#btn-back").onclick = backHome;
  app.querySelector("#btn-back2").onclick = backHome;
  app.querySelector("#btn-print").onclick = () => window.print();
  /* 重新编辑：把这份报告的内容放回草稿、进向导接着改；保存时覆盖原报告而不是新增一份 */
  app.querySelector("#btn-reedit").onclick = () => {
    const i = reports.indexOf(r);
    if (i < 0) return;
    const draft = loadDraft();
    if (draft && Object.keys(draft).length && !confirm("当前未完成的复盘草稿会被这份报告的内容替换，继续吗？")) return;
    values = JSON.parse(JSON.stringify(r.values));
    editingReportIdx = i;
    saveDraft();
    reviewEdit = -1; reviewIdx = null; decIdx = 0; auxTab = null;
    cur = 0; view = "wizard"; viewingReport = null;
    goRender();
  };
  app.querySelector("#btn-del").onclick = () => {
    const i = reports.indexOf(r);
    if (i < 0) return;
    if (!confirm("确定删除这份报告吗？此操作不可撤销。")) return;
    reports.splice(i, 1);
    if (editingReportIdx === i) editingReportIdx = null;
    else if (editingReportIdx != null && editingReportIdx > i) editingReportIdx--;
    persistReports();
    backHome();
  };
  app.querySelector("#btn-copy").onclick = () => {
    const text = reportToText(r);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flashCopied(), () => fallbackCopy(text));
    } else fallbackCopy(text);
  };
  function backHome() { view = "home"; viewingReport = null; goRender(); }
}

function reportToText(r) {
  const v = r.values;
  const vd = verdictOf(v);
  const L = [];
  L.push(TOOL.reportKicker.split(" · ")[0] + "：" + (v[TOOL.titleKey] || "未命名"));
  if (vd.t) L.push("综合判定：" + vd.t);
  if (v[TOOL.conclusionKey]) L.push("一句话结论：" + v[TOOL.conclusionKey]);
  L.push("");

  PHASES.forEach((ph, pi) => {
    L.push("════ " + ph.name + " ════");
    STEPS.forEach((st, si) => {
      if (st.phase !== pi) return;
      const pairs = [];
      fieldsFor(st.id, v).forEach(f => {
        if (f.type === "note" || f.type === "dtex") return;
        if (f.type === "subtitle") { if (f.rv) pairs.push(["§" + f.label, ""]); return; }
        if (f.showIf && !f.showIf(v)) return;
        const val = v[f.key];
        if (f.type === "radio") {
          const opt = (f.options || []).find(o => o[0] === val);
          if (opt) pairs.push([f.label, opt[1]]);
        } else if (f.type === "score") {
          if (val != null && val !== "") pairs.push([f.label, val + " / 5"]);
        } else if (f.type === "assess") {
          const rows = (f.sources || []).reduce((acc, k) => acc.concat((Array.isArray(v[k]) ? v[k] : []).filter(x => (x.t || "").trim())), []);
          const ans = val || {};
          const itemsOf = key => (Array.isArray(v[key]) ? v[key] : []).filter(x => (x.t || "").trim()).map(x => x.t);
          rows.forEach((row, ri) => {
            const a = ans["i" + ri];
            if (!a) return;
            const opt = (f.options || []).find(o => o[0] === a);
            pairs.push(["" + (row.t || ""), opt ? opt[1] : ""]);
            if (a === "yes" || a === "part") { const it = itemsOf(f.knownKey + "_" + ri); if (it.length) pairs.push(["　└ 当时合理可知的信号", it]); }
            if (a === "part" || a === "no") { const it = itemsOf(f.hindKey + "_" + ri); if (it.length) pairs.push(["　└ 只是事后才显得必然", it]); }
          });
        } else if (f.type === "chipslist") {
          const chipMap = {};
          (f.chips || []).forEach(ch => { chipMap[ch[0]] = ch[1]; });
          const items = (Array.isArray(val) ? val : []).map(x => (x.t || "") + (x.c && chipMap[x.c] ? "（" + chipMap[x.c] + "）" : ""));
          if (items.length) pairs.push([f.label, items]);
        } else if (f.type === "triplist") {
          const rows = (Array.isArray(val) ? val : []).filter(r2 => (r2.a || "").trim() || (r2.b || "").trim() || (r2.c || "").trim());
          if (rows.length) pairs.push([f.label, rows.map(r2 => (r2.a || "") + "：事前 " + (r2.b || "—") + " → 基准 " + (r2.c || "—"))]);
        } else if (f.type === "viewtrack_multi") {
          const groups = Array.isArray(val) ? val : [];
          groups.forEach((g, gi) => {
            const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
            const outs = (Array.isArray(g.out) ? g.out : []).filter(x => (x.t || "").trim()).map(x => x.t);
            const ins = (Array.isArray(g.in) ? g.in : []).filter(x => (x.t || "").trim()).map(x => x.t);
            if (outs.length) pairs.push([title + "：外视角", outs]);
            if (ins.length) pairs.push([title + "：内视角", ins]);
          });
        } else if (f.type === "calgroup") {
          const idx = f.index;
          const groups = Array.isArray(v["vt_" + idx]) ? v["vt_" + idx] : [];
          const cals = Array.isArray(val) ? val : [];
          const n2 = Math.max(groups.length, cals.length);
          for (let gi = 0; gi < n2; gi++) {
            const g = groups[gi] || {};
            const c = cals[gi] || {};
            const title = (g.name || "").trim() ? g.name : "观点追踪 " + (gi + 1);
            if ((c.same || "").trim()) pairs.push([title + "：完全相同的地方", c.same]);
            if ((c.deviate || "").trim()) pairs.push([title + "：偏离分析", c.deviate]);
            if ((c.cal || "").trim()) pairs.push([title + "：校准后的判断", c.cal]);
          }
        } else if (f.type === "quadpick") {
          const t = quadText(v, f.key);
          if (t) pairs.push([f.label, t]);
        } else if (f.type === "quadpair") {
          const fin = val || v.quadrant;
          let t = quadText({ quadrant: fin }, "quadrant");
          if (v.quadrant && QUADS[v.quadrant]) {
            t += (val && val !== v.quadrant) ? "（初步判断：" + QUADS[v.quadrant].name + "，已修正）" : "（与初步判断一致）";
          }
          if (t) pairs.push([f.label, t]);
        } else if (f.type === "yesno") {
          const ans = val || {};
          const items = [];
          f.items.forEach((qtext, i) => {
            const a = ans["i" + i];
            if (!a) return;
            let line = qtext + "：" + (a === "yes" ? "是" : "否");
            if (a === "yes" && ans["n" + i]) line += "（" + ans["n" + i] + "）";
            items.push(line);
          });
          if (items.length) pairs.push([f.label, items]);
          if (f.extraList && Array.isArray(v[f.extraList.key]) && v[f.extraList.key].length) pairs.push([f.extraList.label, v[f.extraList.key]]);
        } else if (f.type === "pairs") {
          const rows = (Array.isArray(val) ? val : []).filter(x => (x.d || "").trim() || (x.r || "").trim());
          const items = rows.map(x => (x.d || "（未填）") + " → " + (x.r || "（未填）"));
          if (items.length) pairs.push([f.label, items]);
        } else if (f.type === "dtree") {
          const idx = f.index;
          const p2 = decPairs(v)[idx] || {};
          const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
          const items = [];
          const act2 = v["actual_" + idx] || {};
          if ((p2.r || "").trim()) items.push("实际发生（已同步）：" + p2.r + ((act2.p || "").trim() ? "（概率 " + act2.p + "）" : "") + (act2.c && EVAL_LABELS[act2.c] ? "（" + EVAL_LABELS[act2.c] + "）" : ""));
          alts.forEach(a => { if ((a.t || "").trim()) items.push(a.t + (a.p ? "（概率 " + a.p + "）" : "") + (a.c && EVAL_LABELS[a.c] ? "（" + EVAL_LABELS[a.c] + "）" : "")); });
          if (items.length) pairs.push(["决策树 " + (idx + 1) + "：" + (p2.d || ""), items]);
        } else if (f.type === "betterpick") {
          const idx = f.index;
          const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
          const ans = val || {};
          const items = [];
          alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) items.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
          if (items.length) pairs.push([f.label, items]);
        } else if (f.type === "betterscore") {
          const idx = f.index;
          const alts = Array.isArray(v["alts_" + idx]) ? v["alts_" + idx] : [];
          const ans = val || {};
          const repeatMap2 = { yes: "会", no: "不会", unsure: "不确定" };
          const luckMap2 = { luck: "主要靠运气", half: "运气与决策各半", skill: "主要靠决策质量" };
          const sv2 = v[f.scoreKey];
          if (sv2 != null && sv2 !== "") pairs.push(["① 决策质量评分", sv2 + " / 5"]);
          const items = [];
          alts.forEach((row, ri) => { if ((row.t || "").trim() && ans["i" + ri]) items.push(row.t + (row.p ? "（概率 " + row.p + "）" : "")); });
          if (items.length) pairs.push(["② 比实际更好的潜在结果", items]);
          const rp2 = v[f.repeatKey];
          if (rp2 && repeatMap2[rp2]) pairs.push(["③ 重来一次是否同样决策", repeatMap2[rp2]]);
          if (v[f.reasonKey]) pairs.push(["③ 原因", v[f.reasonKey]]);
          const lk3 = v[f.luckKey];
          if (lk3 && luckMap2[lk3]) pairs.push(["④ 这个实际结果更多由什么决定", luckMap2[lk3]]);
          if (v[f.respKey]) pairs.push(["④ 对自身责任的看法", v[f.respKey]]);
        } else if (f.type === "ktflow") {
          const idx = f.index;
          const p3 = decPairs(v)[idx] || {};
          const kb = (Array.isArray(v["known_before_" + idx]) ? v["known_before_" + idx] : []).filter(x => (x.t || "").trim());
          const la = (Array.isArray(v["learned_after_" + idx]) ? v["learned_after_" + idx] : []).filter(x => (x.t || "").trim());
          if (kb.length) pairs.push(["① 做决策前就知道的事", kb]);
          if ((p3.d || "").trim()) pairs.push(["② 决策", p3.d]);
          if ((p3.r || "").trim()) pairs.push(["③ 结果", p3.r]);
          if (la.length) pairs.push(["④ 结果出来后才知道的事", la]);
        } else {
          if (val != null && val !== "" && (!Array.isArray(val) || val.length)) pairs.push([f.label, val]);
        }
      });
      /* 空分组（分组行后没有任何答案）不输出 */
      const pairsF = pairs.filter((pr, i) => !(pr[0].charAt(0) === "§" && (i === pairs.length - 1 || pairs[i + 1][0].charAt(0) === "§")));
      if (pairsF.length) section_text(L, (si + 1) + ". " + st.title, pairsF);
    });
  });
  return L.join("\n");

  function section_text(L2, name, pairs) {
    L2.push("【" + name + "】");
    pairs.forEach(function (pv2) {
      const label = pv2[0], val = pv2[1];
      if (label.charAt(0) === "§") { L2.push("── " + label.slice(1) + " ──"); return; }
      if (val == null || val === "" || (Array.isArray(val) && val.length === 0)) return;
      if (Array.isArray(val)) {
        L2.push(label + "：");
        val.forEach(x => L2.push("  - " + (typeof x === "object" ? (x.t || "") : x)));
      } else L2.push(label + "：" + val);
    });
    L2.push("");
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch (e) {}
  document.body.removeChild(ta);
}
function flashCopied() {
  const btn = app.querySelector("#btn-copy");
  if (!btn) return;
  const old = btn.textContent;
  btn.textContent = "已复制 ✓";
  setTimeout(() => { btn.textContent = old; }, 1500);
}

/* ---------- 启动 ---------- */
migrateBaseline();
render();
</script>
